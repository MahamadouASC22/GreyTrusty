<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find your advisor — Greylock Trust</title>
<meta name="description" content="Explore Greylock Trust advisors and find personalized technology support from professionals matched to your needs, experience, and preferences. ">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
.acct{display:grid;gap:12px;max-width:380px;margin:26px auto 0;text-align:left;}
.acct label{font-size:12.5px;font-weight:700;color:var(--ink);display:block;}
.acct input{width:100%;margin-top:6px;padding:12px 14px;font-size:15px;font-family:var(--f);
  border:1px solid var(--line-2);border-radius:12px;background:#fff;color:var(--body-c);}
.acct input:focus{outline:none;border-color:var(--gold);}
.acct input.err{border-color:#B4452F;}
.amsg{display:none;font-size:11.5px;color:#B4452F;margin-top:4px;}
.amsg.on{display:block;}
.anote{font-size:12.5px;color:var(--faint);text-align:center;margin-top:6px;line-height:1.6;}
.anote a{color:var(--gold-deep);font-weight:600;}

.q-inner{
  max-width:1100px;width:100%;text-align:center;
  animation:qin .25s ease both;
  transition:opacity .2s ease;
  will-change:opacity;
  -webkit-backface-visibility:hidden;
  transform:translateZ(0);
}
@keyframes qin{from{opacity:0}to{opacity:1}}   /* opacity only, no translateY */


.q-mid{flex:1;display:flex;align-items:center;justify-content:center;
  padding:16px 24px;overflow-y:auto;overflow-x:hidden;
  position:relative;isolation:isolate;-webkit-overflow-scrolling:touch;}


.head{padding:calc(96px + 1.6vw) 26px 0;text-align:center;}
.head h1{font-family:'Fraunces',Georgia,serif;font-weight:300;letter-spacing:-.03em;
  font-size:clamp(30px,4vw,46px);color:var(--ink);}
.head h1 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.head .sub{font-size:15.5px;color:var(--muted);margin-top:10px;}
/* filter pills */
.fbar{padding:20px 26px 14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.fpill{position:relative;}
.fpill>button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);
  background:#fff;border-radius:999px;padding:12px 18px;font-size:14.5px;font-weight:600;color:var(--ink);}
.fpill>button:hover{border-color:var(--ink);}
.fpill>button.active{border-color:var(--gold);background:var(--gold-wash);}
.fpill.primary>button{border:1.5px solid var(--ink);}
.fpill .panel{position:absolute;top:calc(100% + 8px);left:0;z-index:500;min-width:236px;
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);
  padding:8px;display:none;}
.fpill.open .panel{display:block;} .fpill.open>button{border-color:var(--ink);}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 13px;
  border-radius:11px;font-size:14px;font-weight:500;color:var(--body-c);}
.opt:hover{background:var(--bg);}
.opt.sel{color:var(--ink);font-weight:700;background:var(--gold-wash);}
.opt .tick{width:16px;color:var(--gold-deep);font-weight:700;}
.fmore>button{background:var(--ink);border-color:var(--ink);color:#fff;}
.fmore .badge{background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:999px;
  min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.fmore .panel{left:auto;right:0;}
.psec{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);padding:10px 13px 4px;}
/* list */
.list{max-width:900px;margin:0 auto;padding:26px 26px 90px;
  transition:max-width .5s cubic-bezier(.32,.9,.3,1),transform .5s cubic-bezier(.32,.9,.3,1);}
.count{font-size:13.5px;color:var(--muted);margin:0 0 18px 2px;display:flex;align-items:baseline;}
.count b{color:var(--ink);font-weight:700;}
.redo{margin-left:auto;font-size:12.5px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;}
.redo:hover{color:var(--gold-deep);}
.cards{display:flex;flex-direction:column;gap:18px;}
.adv{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;
  display:grid;grid-template-columns:188px 1fr;grid-template-rows:1fr auto;gap:0 24px;position:relative;
  transition:box-shadow .22s ease,border-color .22s ease,opacity .35s ease,transform .35s ease;}
.adv:hover{box-shadow:var(--shadow);}
.ava,.ava-fb{width:188px;height:100%;min-height:210px;grid-row:1/2;align-self:stretch;
  border-radius:16px;object-fit:cover;}
.ava-fb{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:48px;font-weight:600;}
.a-name{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.015em;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-right:74px;}
.a-past{font-size:11.5px;font-weight:600;color:var(--gold-deep);}
.a-cred{font-size:14px;color:var(--muted);margin:3px 0 10px;}
.a-rate{font-size:24px;font-weight:700;color:var(--ink);line-height:1;}
.a-rate span{font-size:13.5px;font-weight:600;color:var(--muted);}
.a-meta{font-size:14px;color:var(--body-c);margin-top:8px;}
.a-meta b{font-weight:700;color:var(--ink);}
.a-meta .st{color:var(--gold-deep);} .a-meta .d{color:var(--line-2);margin:0 8px;}
.a-free{font-size:13.5px;font-weight:600;color:var(--gold-deep);margin-top:4px;}
.a-bio{font-size:14.5px;line-height:1.6;color:var(--body-c);margin:10px 0 12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.a-bio a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;}
.a-chips{display:flex;flex-wrap:wrap;gap:7px;}
.a-chip{font-size:12.5px;font-weight:600;background:var(--chipbg);border-radius:999px;
  padding:7px 13px;color:var(--body-c);}
.a-chip.hit{background:var(--gold-wash);color:var(--gold-deep);}
.a-chip.more{background:none;color:var(--faint);padding-left:2px;}
.a-foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line);}
.a-btns{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;}
.a-btns .pill{padding:11px 20px;font-size:14px;}
.ring{position:absolute;top:22px;right:22px;}
.ring svg{transform:rotate(-90deg);}
.ring{position:absolute;}
.ring .bgc{stroke:var(--line);} .ring .arc{stroke:var(--gold);stroke-linecap:round;}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1;}
.ring .rt b{font-size:13.5px;font-weight:700;color:var(--ink);}
.ring .rt span{font-size:7.5px;font-weight:700;letter-spacing:.1em;color:var(--faint);
  text-transform:uppercase;margin-top:1px;}
.empty{background:#fff;border:1px dashed var(--line-2);border-radius:18px;padding:46px;
  text-align:center;color:var(--muted);}
/* ---- side-by-side booking: list slides left, panel opens beside it ---- */
.stage{max-width:1300px;margin:0 auto;padding:26px 26px 90px;display:grid;
  grid-template-columns:minmax(0,1fr) 0fr;gap:0;align-items:start;
  transition:grid-template-columns .5s cubic-bezier(.32,.9,.3,1),gap .5s cubic-bezier(.32,.9,.3,1);}
body.booking .stage{grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:22px;}
.list{max-width:900px;margin:0 auto;width:100%;transition:max-width .5s cubic-bezier(.32,.9,.3,1);}
body.booking .list{max-width:none;margin:0;}
body.booking .adv{grid-template-columns:132px 1fr;padding:18px;}
body.booking .ava,body.booking .ava-fb{width:132px;min-height:150px;font-size:36px;}
body.booking .a-name{font-size:19px;padding-right:66px;}
body.booking .a-bio{-webkit-line-clamp:1;}
body.booking .a-chips{display:none;}
.adv.sel{border-color:var(--gold);box-shadow:0 18px 46px rgba(195,144,60,.18);}
.bcol{position:sticky;top:92px;min-width:0;overflow:hidden;}
.bp-in{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;
  box-shadow:0 20px 54px rgba(30,49,69,.10);
  opacity:0;transform:translateX(26px);transition:opacity .4s ease .08s,transform .5s cubic-bezier(.32,.9,.3,1) .08s;}
body.booking .bp-in{opacity:1;transform:none;}
.bp-head{display:flex;gap:13px;align-items:center;}
.bp-head img,.bp-head .pf{width:54px;height:54px;border-radius:14px;object-fit:cover;}
.bp-head .pf{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-weight:600;font-size:19px;}
.bp-name{font-size:17px;font-weight:700;color:var(--ink);}
.bp-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.bp-x{margin-left:auto;font-size:22px;color:var(--faint);line-height:1;padding:2px 6px;}
.bp-x:hover{color:var(--ink);}
.bp-free{margin-top:13px;background:var(--gold-wash);border:1px solid var(--gold-line);
  border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600;color:var(--gold-deep);}
.bp-sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:18px 0 9px;}
.bp-body{max-height:calc(100vh - 220px);overflow:auto;padding-right:2px;}
.mc{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;}
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.mc-head b{font-size:14px;font-weight:700;color:var(--ink);}
.mc-nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:#fff;
  font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
.mc-nav:hover{border-color:var(--ink);} .mc-nav[disabled]{opacity:.3;cursor:default;}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mc-dow{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);
  text-align:center;text-transform:uppercase;padding:3px 0;}
.mc-day{height:33px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid transparent;}
.mc-day:hover{border-color:var(--gold);}
.mc-day.off{color:var(--faint);opacity:.38;pointer-events:none;}
.mc-day.sel{background:var(--ink);color:#fff;}
.mc-day.blank{visibility:hidden;pointer-events:none;}
.bp-times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;}
.bp-time{border:1px solid var(--line-2);border-radius:10px;padding:10px 5px;text-align:center;
  font-size:13px;font-weight:600;color:var(--ink);background:#fff;}
.bp-time.sel{background:var(--gold);border-color:var(--gold);color:#fff;}
/* details form */
.bf{display:grid;gap:11px;}
.bf label{font-size:12px;font-weight:700;color:var(--ink);display:block;}
.bf input,.bf textarea{width:100%;margin-top:5px;padding:11px 13px;font-size:14.5px;
  font-family:var(--f);border:1px solid var(--line-2);border-radius:11px;
  background:var(--bg);color:var(--body-c);}
.bf input:focus,.bf textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
.bf .err{border-color:#B4452F!important;}
.bf .msg{font-size:11.5px;color:#B4452F;display:none;}
.bf .msg.on{display:block;}
.mode-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--chipbg);
  border-radius:999px;padding:4px;}
.mode-seg button{border-radius:999px;padding:9px 4px;font-size:12.5px;font-weight:700;color:var(--muted);}
.mode-seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,49,69,.09);}
.bp-cta{width:100%;padding:13px;font-size:14.5px;margin-top:14px;}
.bp-cta[disabled]{opacity:.45;cursor:not-allowed;}
.bp-note{font-size:11px;color:var(--faint);margin-top:9px;text-align:center;}
.bp-done{text-align:center;padding:14px 4px;}
.bp-done .tick{width:54px;height:54px;border-radius:50%;background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold-deep);font-size:24px;display:flex;
  align-items:center;justify-content:center;margin:0 auto 14px;}
.bp-done h4{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:7px;}
.bp-done p{font-size:14px;color:var(--muted);line-height:1.7;}


.row{
    display:flex;
    justify-content:center;
}




.start-btn,
.hero {
    display:flex;
    justify-content:center;
    margin:32px auto 0;
    width:fit-content;
}
@media(max-width:1080px){
  body.booking .stage{grid-template-columns:1fr;}
  .bcol{position:fixed;inset:auto 0 0 0;top:auto;z-index:700;max-height:86vh;overflow:auto;
    background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -18px 50px rgba(30,49,69,.2);}
  body.booking .bp-in{border:none;box-shadow:none;border-radius:20px 20px 0 0;}
  .bp-body{max-height:60vh;}
}


/* quiz */
.quiz{position:fixed;left:0;right:0;bottom:0;
  top:76px;                 /* was inset:0 or top:0 — clears the navbar */
  z-index:500;              /* was 800 — below the nav's 700 */
  display:flex;flex-direction:column; background:radial-gradient(900px 560px at 12% 6%,rgba(92,122,153,.13),transparent 62%),
             radial-gradient(760px 520px at 88% 94%,rgba(195,144,60,.12),transparent 58%),
             linear-gradient(168deg,#FFFFFF,#F7FAFC 46%,var(--frost));}
.q-bar{height:3px;background:var(--line);}
.q-bar i{display:block;height:100%;background:var(--gold);width:0;
  transition:width .3s ease;}
.q-mid{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 24px;overflow:auto;}
.q-inner{
  max-width:1100px;
  width:100%;
  text-align:center;
}@keyframes qin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.q-inner h2{font-family:'Fraunces',Georgia,serif;font-weight:300;letter-spacing:-.03em;
  font-size:clamp(26px,3.6vw,40px);line-height:1.14;color:var(--ink);}
.q-inner h2 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.q-sub{margin:9px 0 24px;font-size:15px;color:var(--muted);}
.q-opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.q-opt{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:12px 21px;
  font-size:14.5px;font-weight:600;color:var(--ink);}
.q-opt:hover{border-color:var(--gold);}
.q-opt.on{background:var(--gold);border-color:var(--gold);color:#fff;
  box-shadow:0 8px 20px rgba(195,144,60,.28);}
.q-zip{width:210px;margin:0 auto;display:block;text-align:center;letter-spacing:.14em;padding:14px;
  font-size:18px;font-weight:600;border:1px solid var(--line-2);border-radius:13px;
  font-family:var(--f);outline:none;background:#fff;color:var(--ink);}
.q-zip:focus{border-color:var(--gold);}
.q-hint{margin-top:9px;font-size:12px;color:var(--faint);}
.q-skiplink{font-size:13px;color:var(--faint);text-decoration:underline;}
.q-slider{display:flex;align-items:center;gap:14px;max-width:400px;margin:22px auto 0;}
.q-slider input{flex:1;accent-color:var(--gold);}
.q-slider .v{font-weight:700;color:var(--gold-deep);min-width:70px;text-align:left;font-size:14.5px;}
.q-bot{


display:grid;


grid-template-columns:1fr auto 1fr;


align-items:center;


padding:18px 28px;


border-top:1px solid var(--line);


background:rgba(255,255,255,.92);


backdrop-filter:blur(10px);


}


.q-back{


justify-self:end;


}


.q-next{


justify-self:start;


margin-left:12px;


}
.q-browse{position:absolute;left:26px;top:50%;transform:translateY(-50%);font-size:13.5px;
  font-weight:600;color:#fff;background:var(--ink);border-radius:999px;padding:12px 21px;}
.q-browse:hover{background:var(--ink-2);}
@media(max-width:640px){.q-browse{display:none;}}
.q-back{border:1px solid var(--line-2);background:#fff;color:var(--body-c);border-radius:999px;
  font-weight:600;font-size:14px;padding:12px 26px;}
.q-next{background:var(--gold);color:#fff;border-radius:999px;font-weight:700;font-size:14px;padding:12px 36px;}
.q-next:hover{background:var(--gold-deep);}


.q-inner{


animation:qin .25s ease;


opacity:1;


}


.q-inner h2{


display:block;


opacity:1;


visibility:visible;


}


.q-sub{


display:block;


opacity:1;


visibility:visible;


}


.rt2{


font-size:18px;


font-weight:700;


color:var(--ink);


margin-bottom:6px;


}


.rs{


font-size:15px;


line-height:1.6;


color:var(--muted);


}
@media(max-width:640px){
  .quiz{top:64px;}
  .q-bot{grid-template-columns:1fr;gap:8px;padding:12px 16px;}
  .q-browse{display:none;}
  .q-back,.q-next{justify-self:stretch;margin-left:0;}
}
.art{


width:100%;


max-width:360px;


display:block;


margin:0 auto 32px;


border-radius:18px;


}


.art-ph{


width:360px;


height:240px;


display:flex;


align-items:center;


justify-content:center;


border:2px dashed var(--line);


border-radius:18px;


color:var(--muted);


margin:0 auto 32px;


}


.wel{


display:flex;


flex-direction:column;


justify-content:center;


align-items:center;


text-align:center;


max-width:760px;


margin:auto;


}


.wel h2{
  font-family:'Fraunces',Georgia,serif;
  font-weight:300;
  letter-spacing:-.04em;
  line-height:1.1;
  font-size:clamp(34px,4vw,52px);
}


.wel .q-sub{
  font-size:17px;
  line-height:1.7;
  max-width:550px;
  margin-left:auto;
  margin-right:auto;
}


.q-inner{


transition:opacity .2s ease;


}
.wel .rows{
  margin-top:35px;
  width:100%;
}


.wel .row{
  display:flex;
  justify-content:center;
  text-align:center;
  gap:18px;
  align-items:flex-start;
  padding:18px 0;
  border-top:1px solid var(--line);
}


.wel .row:last-child{
  border-bottom:1px solid var(--line);
}




@media(max-width:720px){
  .wel{
    grid-template-columns:1fr;
    gap:30px;
    text-align:center;
  }


  .wel:after{
    display:none;
  }


  .wel .row{
    text-align:left;
  }
}

@media(max-width:700px){
  .stage{padding:18px 14px 70px;}
  .list{padding:0;}
  .adv{grid-template-columns:1fr;padding:16px;gap:14px;}
  .ava,.ava-fb{width:100%;height:200px;min-height:0;grid-row:auto;}
  .a-name{font-size:19px;padding-right:64px;}
  .ring{top:14px;right:14px;transform:scale(.88);transform-origin:top right;}
  .a-foot{flex-direction:column;align-items:stretch;}
  .a-btns{margin-left:0;flex-direction:column;}
  .a-btns .pill,.a-foot>.pill{width:100%;}
  .fbar{padding:14px;gap:8px;}
  .fpill>button{padding:10px 14px;font-size:13.5px;}
  .fpill .panel{min-width:min(280px,calc(100vw - 40px));}
  .head{padding-top:78px;}
}


/* keep the button bar on screen */
.q-mid{min-height:0;}
.q-bot{position:relative;flex:none;}
.quiz{height:auto;}
@media(max-width:640px){
  .q-mid{padding:14px 16px;}
  .q-inner h2{font-size:clamp(23px,6.4vw,31px);}
  .wel h2{font-size:clamp(26px,7vw,34px);}
  .wel .rows{margin-top:22px;}
  .wel .row{padding:13px 0;}
  .q-opts{gap:8px;}
  .q-opt{padding:11px 17px;font-size:14px;}
}
</style>
</head>
<body class="nav-dark">
<div id="nav"></div>


<header class="head">
  <h1>Advisors matched to <em>you.</em></h1>

/* ---------- matching ---------- */
function score(a){
  let s=48;
  P.need.forEach(n=>{if(a.specs.includes(n))s+=10;});
  if(a.rate<=P.budget)s+=6;else s-=12;
  if(P.logi==='onsite'){a.onsite?s+=6:s-=15;}
  if(P.logi==='remote'&&a.remote)s+=5;
  if(P.personality&&a.personality===P.personality)s+=9;
  if(P.style==='enjoy'&&a.personality==='Patient teacher')s+=4;
  if(P.style==='works'&&a.personality==='Efficient problem solver')s+=4;
  if(P.style==='stress'&&a.personality==='Calm and reassuring')s+=5;
  if(P.learn==='along'&&a.personality==='Patient teacher')s+=4;
  if(P.learn==='handle'&&a.personality==='Efficient problem solver')s+=4;
  if((P.urgency==='today'||P.urgency==='days')&&(a.evenings||a.weekends))s+=5;
  if(P.reasons.includes('Someone I can trust'))s+=(a.rating-4.5)*8+(a.reviews>150?3:0);
  if(P.reasons.includes('Learning over time')&&a.personality==='Patient teacher')s+=5;
  if(P.reasons.includes('My business')&&a.business)s+=6;
  if(P.reasons.includes('My family')&&a.futures.includes('Family tech support'))s+=5;
if(P.reasons.includes('Privacy and data protection')&&a.specs.includes('Data Protection'))s+=5;  if(P.working.includes('evenings')&&a.evenings)s+=3;
  if(P.working.includes('weekends')&&a.weekends)s+=3;
  if(P.working.includes('checkins')&&a.checkins)s+=4;
  P.goals.forEach(g=>{if(a.futures.includes(g))s+=2;});
  if(a.past)s+=6;
  return {pct:Math.max(44,Math.min(99,Math.round(s)))};
}

function buildFilters(){
  const bar=document.getElementById('fbar');bar.innerHTML='';

        return `<button class="opt ${sel?'sel':''}" data-v="${v}"><span class="tick">${sel?'\u2713':''}</span>${t}</button>`;
      }).join('')}</div>`;
    w.querySelector('button').addEventListener('click',e=>{e.stopPropagation();toggleP(w);});

      F[f.k]=f.k==='rate'?+o.dataset.v:o.dataset.v;buildFilters();update();}));

  });
  const mc=MORE.filter(m=>m.k==='sort'?F.sort!=='match':F[m.k]!=='').length;

          <span class="tick">${sel?'\u2713':''}</span>${t}</button>`;}).join('')).join('')}</div>`;
  mw.querySelector('button').addEventListener('click',e=>{e.stopPropagation();toggleP(mw);});
  mw.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{
    F[o.dataset.k]=o.dataset.v;buildFilters();update();}));
  bar.appendChild(mw);
}
function toggleP(w){
  const was=w.classList.contains('open');

let current=[];
function update(){
  saveQuiz();

   .filter(a=>F.meet!=='onsite'||a.onsite)
   .filter(a=>F.meet!=='remote'||a.remote)
   .filter(a=>!F.spec||a.specs.includes(F.spec))
   .filter(a=>F.avail!=='evenings'||a.evenings).filter(a=>F.avail!=='weekends'||a.weekends)
   .filter(a=>!F.pers||a.personality===F.pers).filter(a=>a.rate<=F.rate)
   .filter(a=>F.offer!=='checkins'||a.checkins).filter(a=>F.offer!=='business'||a.business);
  current.sort((x,y)=>F.sort==='rating'?y.rating-x.rating:
    F.sort==='rate'?x.rate-y.rate:y.m.pct-x.m.pct);
  document.getElementById('countTxt').innerHTML=
    `<b>${current.length}</b>&nbsp;advisor${current.length===1?'':'s'} matched to you`;
  const cards=document.getElementById('cards');
  cards.innerHTML=current.length?'':'<div class="empty">No one fits those filters \u2014 loosen one and they\u2019ll return.</div>';
  current.forEach(a=>{
    const hit=new Set(P.need);
    cards.insertAdjacentHTML('beforeend',`
     <article class="adv" id="card-${a.id}">
      ${ringHTML(a.m.pct)}
      ${avatarHTML(a,'ava','ava-fb')}
      <div>
        <h3 class="a-name">${a.name}${a.past?'<span class="a-past">\u2726 Booked before</span>':''}</h3>
        <p class="a-cred">${a.title}, ${a.yrs} years of experience</p>
        <div class="a-rate">$${a.rate}<span>/hour</span></div>
          <span class="d">\u00b7</span>${a.onsite?(a.remote?'Virtual \u2022 In-Person':'In-Person'):'Virtual'}
          <span class="d">\u00b7</span>Next available <b>${a.nextAvail}</b></p>
        ${a.intro?'<p class="a-free">Offers a free 20-minute intro call</p>':''}
<p class="a-bio">${a.bio} <a href="advisor.html?id=${a.id}#a=${a.id}">Read more</a></p>
        <div class="a-chips">
          ${a.specs.slice(0,3).map(s=>`<span class="a-chip ${hit.has(s)?'hit':''}">${s}</span>`).join('')}
          <span class="a-chip more">+ ${a.futures.length} more</span>
        </div>
      </div>
      <div class="a-foot">
<a class="pill pill-soft" href="advisor.html?id=${a.id}#a=${a.id}">View Profile</a>
        <div class="a-btns">
          ${a.intro?`<button class="pill pill-goldline" onclick="openBook(${a.id},'intro')">Book Free Intro Call</button>`:''}
          <button class="pill pill-gold" onclick="openBook(${a.id},'session')">Book Session</button>
        </div>
      </div>
     </article>`);
  });
}


/* ---------- booking, inline beside the list ---------- */
let B={id:null,mode:'session',date:null,mView:null,time:null,step:'when',
       meet:'',name:'',email:'',phone:'',address:'',notes:'',done:false};
function openBook(id,mode){
  const a=A.find(x=>x.id===id);if(!a)return;
  const isIntro=(mode||'session')==='intro';
  const meet=isIntro?'remote':(a.onsite?(a.remote?'':'onsite'):'remote');
  B={id,mode:mode||'session',date:null,mView:null,time:null,step:'when',
     meet,name:'',email:'',phone:'',address:'',notes:'',done:false};
  document.querySelectorAll('.adv').forEach(el=>el.classList.remove('sel'));
  const card=document.getElementById('card-'+id);if(card)card.classList.add('sel');
  document.body.classList.add('booking');
  renderBook(a);
  if(window.innerWidth>1080&&card)
    setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),260);
}
function closeBook(){
  document.body.classList.remove('booking');
  document.querySelectorAll('.adv').forEach(el=>el.classList.remove('sel'));
}
function needsAddress(){return B.meet==='onsite'||B.meet==='both';}
function renderBook(a){
  const intro=B.mode==='intro';
  const head=`<div class="bp-head">
      ${avatarHTML(a,'','pf')}
      <div><div class="bp-name">${a.name}</div>
        <div class="bp-sub">${intro?'Free 20-minute intro call':'Full session \u00b7 $'+a.rate+'/hour'}</div></div>
      <button class="bp-x" onclick="closeBook()">\u00d7</button>
    </div>`;
  if(B.done){
    document.getElementById('bpIn').innerHTML=head+`
      <div class="bp-done">
        <div class="tick">\u2713</div>
        <h4>You're booked with ${a.name.split(' ')[0]}</h4>
        <p>${dLabel(new Date(B.date))} at ${B.time}<br>
           ${B.meet==='onsite'?'In person, at your address':'Virtual \u2014 link sent by email'}</p>
        <p style="margin-top:12px;font-size:13px">A confirmation is on its way to ${B.email}.
           ${intro?'The intro call is free, with nothing charged today.':''}</p>
        <button class="pill pill-soft" style="margin-top:16px;width:100%" onclick="closeBook()">Back to advisors</button>
      </div>`;
    return;
  }
  if(!B.mView){const n=new Date();B.mView=new Date(n.getFullYear(),n.getMonth(),1);}
  if(!B.date){const p=new Date();p.setHours(0,0,0,0);
    for(let i=1;i<=40;i++){p.setDate(p.getDate()+1);
      if(availFor(a,p,intro).length){B.date=new Date(p);
        B.mView=new Date(p.getFullYear(),p.getMonth(),1);break;}}}
  const mv=B.mView,y=mv.getFullYear(),mo=mv.getMonth();
  const fd=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const prevOk=mv>new Date(today.getFullYear(),today.getMonth(),1);
  let cells='';
  for(let i=0;i<fd;i++)cells+='<button class="mc-day blank"></button>';
  for(let d=1;d<=dim;d++){
    const date=new Date(y,mo,d),av=availFor(a,date,intro).length;
    const sel=B.date&&date.getTime()===new Date(B.date).setHours(0,0,0,0);
    cells+=`<button class="mc-day ${av?'':'off'} ${sel?'sel':''}" data-d="${date.toISOString()}">${d}</button>`;
  }
  const times=B.date?availFor(a,new Date(B.date),intro):[];


  const when=`
    <div class="bp-sec">1 \u00b7 Pick a day</div>
    <div class="mc">
      <div class="mc-head">
        <button class="mc-nav" id="mcPrev" ${prevOk?'':'disabled'}>\u2039</button>
        <b>${MONTHS[mo]} ${y}</b>
        <button class="mc-nav" id="mcNext">\u203a</button>
      </div>
      <div class="mc-grid">${DOW.map(d=>`<div class="mc-dow">${d[0]}</div>`).join('')}${cells}</div>
    </div>
    <div class="bp-sec">2 \u00b7 ${intro?'Pick an intro time':'Pick a time'}${B.date?' \u2014 '+dLabel(new Date(B.date)):''}</div>
    <div class="bp-times">${times.map(t=>
      `<button class="bp-time ${t===B.time?'sel':''}" data-t="${t}">${t}</button>`).join('')||
      '<span style="font-size:13px;color:var(--faint)">Choose an available day above.</span>'}</div>
    <button class="pill pill-gold bp-cta" id="toDetails" ${B.time?'':'disabled'}>
      ${B.time?'Continue to your details':'Select a time to continue'}</button>
    <p class="bp-note">Demo schedule \u2014 real availability comes from each advisor\u2019s calendar.</p>`;


  const modeSeg=intro?`
    <div style="font-size:13px;color:var(--muted)">Intro calls are
      <b style="color:var(--ink)">virtual</b> \u2014 we\u2019ll email you a link.</div>`
   :(a.onsite&&a.remote)?`
    <div><label style="margin-bottom:6px">How would you like to meet?</label>
      <div class="mode-seg">
        <button type="button" data-m="onsite" class="${B.meet==='onsite'?'on':''}">In person</button>
        <button type="button" data-m="remote" class="${B.meet==='remote'?'on':''}">Virtual</button>
        <button type="button" data-m="both" class="${B.meet==='both'?'on':''}">Either</button>
      </div></div>`
   :`<div style="font-size:13px;color:var(--muted)">This advisor meets
      <b style="color:var(--ink)">${a.onsite?'in person':'virtually'}</b>.</div>`;


  const details=`
    <div class="bp-sec">3 \u00b7 Your details</div>
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;
                padding:11px 13px;font-size:13px;margin-bottom:13px">
      <b style="color:var(--ink)">${dLabel(new Date(B.date))} at ${B.time}</b>
      <button style="float:right;font-size:12px;color:var(--gold-deep);font-weight:700"
        id="changeWhen">Change</button>
    </div>
    <form class="bf" id="bookForm" novalidate>
      ${modeSeg}
      <div><label>Full name<input id="bName" type="text" value="${B.name}" autocomplete="name"></label>
        <span class="msg" id="mName">Please enter your name.</span></div>
      <div><label>Email<input id="bEmail" type="email" value="${B.email}" autocomplete="email"></label>
        <span class="msg" id="mEmail">Please enter a valid email.</span></div>
      <div><label>Phone number<input id="bPhone" type="tel" value="${B.phone}" autocomplete="tel"></label>
        <span class="msg" id="mPhone">Please enter a phone number.</span></div>
      ${needsAddress()?`
      <div><label>Address <span style="font-weight:500;color:var(--muted)">(for the in-person visit)</span>
        <input id="bAddr" type="text" value="${B.address}" autocomplete="street-address"></label>
        <span class="msg" id="mAddr">We need an address for in-person visits.</span></div>`:''}
      <div><label>Anything we should know? <span style="font-weight:500;color:var(--muted)">(optional)</span>
        <textarea id="bNotes" rows="3">${B.notes}</textarea></label></div>
      <button class="pill pill-gold bp-cta" type="submit" style="margin-top:4px">
        ${intro?'Confirm free intro call':'Confirm booking'}</button>
      <p class="bp-note">${intro?'Nothing is charged for an intro call.'
        :'Nothing is charged until after the session.'}</p>
    </form>`;


  document.getElementById('bpIn').innerHTML=head


    +`<div class="bp-body">${B.step==='when'?when:details}</div>`;


  if(B.step==='when'){
    const pv=document.getElementById('mcPrev');
    if(pv&&prevOk)pv.addEventListener('click',()=>{B.mView=new Date(y,mo-1,1);renderBook(a);});
    document.getElementById('mcNext').addEventListener('click',()=>{B.mView=new Date(y,mo+1,1);renderBook(a);});
    document.querySelectorAll('.mc-day:not(.off):not(.blank)').forEach(b=>b.addEventListener('click',()=>{
      B.date=new Date(b.dataset.d);B.time=null;renderBook(a);}));
    document.querySelectorAll('.bp-time').forEach(b=>b.addEventListener('click',()=>{
      B.time=b.dataset.t;renderBook(a);}));
    const go=document.getElementById('toDetails');
    if(go&&B.time)go.addEventListener('click',()=>{B.step='details';renderBook(a);});
  }else{
    document.getElementById('changeWhen').addEventListener('click',()=>{B.step='when';renderBook(a);});
    document.querySelectorAll('.mode-seg button').forEach(b=>b.addEventListener('click',()=>{
      B.meet=b.dataset.m;
      B.name=val('bName');B.email=val('bEmail');B.phone=val('bPhone');
      B.address=val('bAddr');B.notes=val('bNotes');
      renderBook(a);}));
    document.getElementById('bookForm').addEventListener('submit',e=>{
      e.preventDefault();
      B.name=val('bName');B.email=val('bEmail');B.phone=val('bPhone');
      B.address=val('bAddr');B.notes=val('bNotes');
      let ok=true;
      ok=check('bName','mName',B.name.length>=2)&&ok;
      ok=check('bEmail','mEmail',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(B.email))&&ok;
      ok=check('bPhone','mPhone',B.phone.replace(/[^0-9]/g,'').length>=7)&&ok;
      if(needsAddress())ok=check('bAddr','mAddr',B.address.length>=6)&&ok;
      if(!ok)return;
      B.done=true;renderBook(a);
    });
  }
}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function check(id,msg,pass){
  const el=document.getElementById(id),m=document.getElementById(msg);
  if(el)el.classList.toggle('err',!pass);
  if(m)m.classList.toggle('on',!pass);
  return pass;
}

function val2(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function amark(id,msg,pass){
  const e=document.getElementById(id),m=document.getElementById(msg);
  if(e)e.classList.toggle('err',!pass);
  if(m)m.classList.toggle('on',!pass);
  return pass;
}

document.getElementById('redoQuiz').addEventListener('click',()=>{
try{ QSTORE.removeItem(QKEY); }catch(e){}
  Object.assign(P,{need:[],urgency:null,reasons:[],style:null,learn:null,personality:null,
    working:[],goals:[],zip:'',region:null,zipState:null,logi:null,budget:100});
  Object.assign(F,{meet:'',spec:'',avail:'',pers:'',rate:999,offer:'',sort:'match'});
  step=0;document.getElementById('quiz').style.display='flex';renderStep();
});

if(RETURNING){
  loadQuiz();
  document.getElementById('quiz').style.display = 'none';
  buildFilters(); update();

 const bookId = qs.get('book') || hp.get('book');
  if(bookId){

   history.replaceState({}, '', 'marketplace.html');
}else{

  try{ localStorage.removeItem(QKEY); }catch(e){}   // clears the stuck old entries
  step = 0;
  document.getElementById('quiz').style.display = 'flex';
  renderStep();
}
