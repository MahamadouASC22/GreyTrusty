<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advisor Portal — Greylock Trust</title>
<meta name="description" content="Sign in to the Greylock Trust provider portal to manage your calendar, clients, profile, and payouts.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
:root{ --serif:'Fraunces',Georgia,serif; }
.page{min-height:100vh;display:flex;align-items:center;
  padding:calc(96px + 2vw) 22px clamp(60px,7vw,90px);
  background:radial-gradient(900px 560px at 84% 8%,rgba(195,144,60,.14),transparent 60%),
             radial-gradient(780px 520px at 8% 92%,rgba(92,122,153,.13),transparent 62%),
             linear-gradient(165deg,#FFFFFF,#F7FAFC 48%,var(--frost));}
.shell{max-width:1080px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:1fr 452px;gap:clamp(28px,5vw,66px);align-items:center;}
@media(max-width:900px){.shell{grid-template-columns:1fr;gap:34px;}}


.intro{
  align-self:flex-start;
  padding-top:40px;
}


/* left column */
.intro .k{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.84);
  border:1px solid var(--line-2);border-radius:999px;padding:8px 15px;font-size:12.5px;
  font-weight:600;color:var(--ink);margin-bottom:22px;}
.intro .k i{width:7px;height:7px;border-radius:50%;background:var(--gold);}
.intro h1{font-family:var(--serif);font-weight:300;color:var(--ink);
  font-size:clamp(34px,5vw,60px);line-height:1.02;letter-spacing:-.035em;}
.intro h1 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.intro p{font-size:16.5px;color:var(--body-c);line-height:1.75;margin-top:18px;max-width:42ch;}
.inside{margin-top:28px;padding-top:24px;border-top:1px solid var(--line);}
.inside .t{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px;}
.inside ul{list-style:none;display:grid;gap:11px;}
.inside li{display:flex;gap:12px;font-size:14.5px;color:var(--body-c);line-height:1.55;}
.inside li i{width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none;margin-top:6px;}


/* card */
.card2{background:#fff;border:1px solid var(--line);border-radius:22px;
  box-shadow:0 26px 64px rgba(30,49,69,.11);padding:clamp(26px,3vw,34px);}
.card2 h2{font-family:var(--serif);font-weight:400;font-size:25px;color:var(--ink);
  letter-spacing:-.02em;}
.card2 .sub{font-size:14px;color:var(--muted);margin-top:6px;margin-bottom:22px;}
.fld{margin-bottom:14px;}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink);display:block;}
.fld input{width:100%;margin-top:6px;padding:13px 15px;font-size:15px;font-family:var(--f);
  border:1px solid var(--line-2);border-radius:12px;background:var(--bg);color:var(--body-c);}
.fld input:focus{outline:none;border-color:var(--gold);background:#fff;}
.fld.err input{border-color:#B4452F;}
.fld .msg{display:none;font-size:11.5px;color:#B4452F;margin-top:5px;}
.fld.err .msg{display:block;}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:4px;font-size:13px;flex-wrap:wrap;}
.rowline label{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--muted);
  font-size:13px;}
.rowline input{width:auto;margin:0;}
.rowline a{color:var(--gold-deep);font-weight:600;}
.rowline a:hover{text-decoration:underline;text-underline-offset:3px;}
.sign{width:100%;padding:14px;font-size:15px;margin-top:20px;}
.note{margin-top:14px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.6;}
.divide{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--faint);font-size:12px;}
.divide::before,.divide::after{content:"";flex:1;height:1px;background:var(--line);}
.join{background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:16px;
  padding:18px 20px;text-align:center;}
.join b{display:block;font-size:15px;color:var(--ink);margin-bottom:5px;}
.join p{font-size:13.5px;color:var(--body-c);line-height:1.6;margin-bottom:14px;}
.join .pill{width:100%;padding:12px;font-size:14px;}
.pill-gold{background:var(--gold);color:#fff;font-weight:600;}
.pill-gold:hover{background:var(--gold-deep);}
.pill-ink{background:var(--ink);color:#fff;font-weight:600;}
.pill-ink:hover{background:var(--ink-2);}
.pill-soft{border:1px solid var(--line-2);color:var(--ink);background:#fff;font-weight:600;}
.pill-soft:hover{border-color:var(--ink);}
.help{margin-top:22px;text-align:center;font-size:13px;color:var(--muted);}
.help a{color:var(--gold-deep);font-weight:600;}
/* signed-in confirmation */
.ok{text-align:center;padding:10px 4px;}
.ok .tick{width:58px;height:58px;border-radius:50%;background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold-deep);font-size:26px;display:flex;
  align-items:center;justify-content:center;margin:0 auto 16px;}
.ok h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:9px;}
.ok p{font-size:14.5px;color:var(--muted);line-height:1.7;}
</style>
</head>
<body class="nav-dark">
<div id="nav"></div>


<main class="page">
  <div class="shell">


    <div class="intro">
      <h1>Your practice,<br><em>in one place.</em></h1>
      <p>Access everything you'll need to start your day, provide help, and protect your clients with your login information</p>
      </div>


    <div class="card2" id="card"></div>


  </div>
</main>


<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
'use strict';
const S={email:'',pw:'',done:false};


function draw(){
  const c=document.getElementById('card');
  if(S.done){
    c.innerHTML=`<div class="ok">
      <div class="tick">✓</div>
      <h3>Signed in</h3>
      <p>This is a demo sign-in, so there's no dashboard behind it yet — connect Supabase Auth and
         this is where advisors will land.</p>
      <button class="pill pill-soft" style="width:100%;padding:12px;margin-top:18px"
        onclick="S.done=false;draw()">Back to sign in</button>
    </div>`;
    return;
  }
  c.innerHTML=`
    <h2>Provider sign in</h2>
    <p class="sub">Welcome back. Use the email address on your advisor account.</p>
    <form id="form" novalidate>
      <div class="fld" id="f-email">
        <label>Email<input id="i-email" type="email" value="${S.email}" autocomplete="email"
          placeholder="you@example.com"></label>
        <span class="msg">Enter a valid email address.</span>
      </div>
      <div class="fld" id="f-pw">
        <label>Password<input id="i-pw" type="password" value="${S.pw}" autocomplete="current-password"
          placeholder="••••••••"></label>
        <span class="msg">Enter your password.</span>
      </div>
      <div class="rowline">
        <label><input type="checkbox"> Keep me signed in</label>
        <a href="#" id="forgot">Forgot password?</a>
      </div>
      <button class="pill pill-ink sign" type="submit">Sign in</button>
    </form>


    <div class="divide">Don't have an account yet?</div>


   


    <p class="help">Looking for a client account instead?
      <a href="login.html">Sign in here</a></p>`;


  document.getElementById('forgot').addEventListener('click',e=>{
    e.preventDefault();
    document.querySelector('.note').textContent=
      'Demo only — password resets will be sent by email once auth is connected.';
  });
  document.getElementById('form').addEventListener('submit',e=>{
    e.preventDefault();
    S.email=val('i-email');S.pw=val('i-pw');
    let ok=true;
    ok=mark('f-email',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email))&&ok;
    ok=mark('f-pw',S.pw.length>=1)&&ok;
    if(!ok)return;
    S.done=true;draw();
  });
}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function mark(id,pass){
  const f=document.getElementById(id);
  if(f)f.classList.toggle('err',!pass);
  return pass;
}
draw();
</script>
</body>
</html>
