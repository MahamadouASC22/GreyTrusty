<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Greylock Trust</title>
<meta name="description" content="Sign in to your Greylock Trust account to access your dashboard, appointments, advisor relationship, and personalized technology support.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
label{font-size:13.5px;font-weight:600;color:var(--ink);display:block;}
input,textarea,select{width:100%;margin-top:6px;padding:12px 14px;font-size:15px;font-family:var(--f);
  border:1px solid var(--line-2);border-radius:12px;background:var(--bg);color:var(--body-c);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);background:#fff;}
.narrow{max-width:460px;margin:0 auto;}
.tabs{display:flex;gap:6px;background:var(--chipbg);border-radius:999px;padding:4px;margin-bottom:22px;}
.tab{flex:1;border-radius:999px;padding:11px;font-size:13.5px;font-weight:700;color:var(--muted);}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,49,69,.09);}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--faint);font-size:12.5px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}
</style>
</head>
<body class="nav-dark">
<div id="nav"></div>
<section class="sec">
  <div class="wrap narrow">
    <div class="center" style="margin-bottom:26px">
      <span class="eyebrow c">Welcome back</span>
      <h1 class="h2" style="margin-top:14px">Sign in</h1>
    </div>
    <div class="card">
     
      <form id="loginForm">
        <label style="margin-bottom:14px">Email<input required type="email" name="email" placeholder="you@example.com"></label>
        <label>Password<input required type="password" name="pw" placeholder="••••••••"></label>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px">
          <label style="display:flex;align-items:center;gap:7px;font-weight:500;color:var(--muted)">
            <input type="checkbox" style="width:auto;margin:0"> Keep me signed in</label>
<a href="reset.html" style="color:var(--gold-deep);font-weight:600">Forgot password?</a>
        </div>
        <button class="pill pill-gold" type="submit" style="width:100%;margin-top:20px;padding:14px">Sign in</button>
        <p id="loginMsg" style="font-size:13px;color:var(--gold-deep);margin-top:12px;text-align:center"></p>
      </form>
<div class="divider">or</div>
      <a class="pill pill-soft" href="marketplace.html" style="width:100%;padding:13px">Find an advisor</a>
      <p style="font-size:12.5px;color:var(--faint);text-align:center;margin-top:14px">
        New here? Answer a few questions and you can create your account at the end.</p>
      <p style="font-size:12.5px;color:var(--faint);text-align:center;margin-top:12px">
        Advisors applying for the first time should <a href="join.html" style="color:var(--gold-deep);font-weight:600">apply here</a>.</p>    </div>
  </div>
</section>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const f=e.target, msg=document.getElementById('loginMsg');
  const btn=f.querySelector('button[type=submit]');
  btn.disabled=true; msg.style.color='var(--muted)'; msg.textContent='Signing you in…';

  const r = await GT_AUTH.signIn(f.email.value, f.pw.value);
  if(!r.ok){ msg.textContent=r.error; msg.style.color='#B4452F'; btn.disabled=false; return; }

  const next = new URLSearchParams(location.search).get('next');
  location.href = next || GT_AUTH.home(r.session);
});
</script>
</body>
</html>
