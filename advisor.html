<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greylock Trust</title>
<meta name="description" content="Meet Greylock Trust advisors who provide personalized technology guidance, privacy support, cybersecurity help, and practical solutions. ">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>

  .rnum{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;
  border-radius:8px;background:var(--gold-wash);border:1px solid var(--gold-line);
  color:var(--gold-deep);font-size:12.5px;font-weight:700;margin-left:auto;}
.rf{border-top:1px solid var(--line);margin-top:20px;padding-top:20px;display:grid;gap:13px;}
.rf label{font-size:12px;font-weight:700;color:var(--ink);display:block;}
.rf input,.rf textarea{width:100%;margin-top:5px;padding:11px 13px;font-size:14.5px;
  font-family:var(--f);border:1px solid var(--line-2);border-radius:11px;
  background:var(--bg);color:var(--body-c);}
.rf input:focus,.rf textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
.rf .err{border-color:#B4452F!important;}
.rf-msg{font-size:11.5px;color:#B4452F;display:none;}
.rf-msg.on{display:block;}
.rscale{display:flex;gap:8px;margin-top:6px;}
.rscale button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line-2);
  background:#fff;font-size:15px;font-weight:700;color:var(--ink);}
.rscale button:hover{border-color:var(--gold);}
.rscale button.on{background:var(--gold);border-color:var(--gold);color:#fff;}
.rf-ok{font-size:13.5px;color:var(--gold-deep);font-weight:600;display:none;}
.rf-ok.on{display:block;}

:root{ --serif:'Fraunces',Georgia,serif; }
.page{max-width:1240px;margin:0 auto;padding:calc(92px + 1.2vw) 26px 90px;}
.back{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;
  color:var(--muted);margin-bottom:16px;}
.back:hover{color:var(--ink);}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;align-items:start;}
@media(max-width:980px){.split{grid-template-columns:1fr;}}


/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;
  margin-bottom:18px;}
.card:last-child{margin-bottom:0;}
.c-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px;}
.card h2{font-family:var(--serif);font-weight:300;font-size:clamp(22px,2.6vw,29px);
  color:var(--ink);letter-spacing:-.025em;line-height:1.14;}
.card h2 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.card p{font-size:15.5px;line-height:1.8;color:var(--body-c);}
.card p+p{margin-top:14px;}


/* ---------- identity card ---------- */
.idc{display:grid;grid-template-columns:190px 1fr;gap:26px;align-items:start;}
@media(max-width:640px){.idc{grid-template-columns:1fr;}}
.idc .ph,.idc .ph-fb{width:190px;height:216px;border-radius:16px;object-fit:cover;}
@media(max-width:640px){.idc .ph,.idc .ph-fb{width:100%;height:250px;}}
.idc .ph-fb{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:52px;font-weight:600;}
.id-name{font-family:var(--serif);font-weight:300;font-size:clamp(28px,3.4vw,40px);
  color:var(--ink);letter-spacing:-.03em;line-height:1.05;}
.id-title{font-size:15.5px;color:var(--muted);margin-top:7px;}
.id-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
.mchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  background:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;
  color:var(--ink);}
.mchip.gold{background:var(--gold-wash);border-color:var(--gold-line);color:var(--gold-deep);}
.mchip svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;}
.id-specs{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.id-specs .t{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:12.5px;font-weight:600;background:var(--chipbg);border-radius:999px;
  padding:7px 13px;color:var(--body-c);}
.chip.g{background:var(--gold-wash);color:var(--gold-deep);}


/* ---------- intro quote ---------- */
.quote{font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:clamp(20px,2.4vw,27px);line-height:1.42;color:var(--ink);letter-spacing:-.015em;}
.quote-mark{font-family:var(--serif);font-size:44px;color:var(--gold);line-height:.6;
  display:block;margin-bottom:10px;}


/* ---------- how they work ---------- */
.works{display:grid;gap:0;margin-top:6px;}
.work{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
.work:last-child{border-bottom:none;}
.work .n{width:30px;height:30px;border-radius:50%;background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold-deep);font-size:12.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;}
.work h4{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:5px;}
.work p{font-size:14.5px;line-height:1.7;color:var(--muted);}


/* ---------- qualifications ---------- */
.quals{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.quals{grid-template-columns:1fr;}}
.qual{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--bg);}
.qual .yr{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--gold-deep);}
.qual h4{font-size:15px;font-weight:700;color:var(--ink);margin:5px 0 4px;}
.qual p{font-size:13.5px;color:var(--muted);line-height:1.6;}
.verified{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);}
.verified b{color:var(--ink);}
.verified .tick{width:24px;height:24px;border-radius:50%;background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold-deep);display:flex;align-items:center;
  justify-content:center;font-size:12px;flex:none;}


/* ---------- ratings ---------- */
.rsum{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}
.rscore{font-size:46px;font-weight:700;color:var(--ink);line-height:1;}
.rscore span{font-size:15px;color:var(--muted);font-weight:600;}
.rstars{color:var(--gold);font-size:15px;letter-spacing:2px;margin-top:5px;}
.rcount{font-size:13px;color:var(--muted);margin-top:4px;}
.bars{flex:1;min-width:210px;}
.bar{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted);margin:3px 0;}
.bar .t{width:36px;}
.bar .track{flex:1;height:6px;background:var(--chipbg);border-radius:99px;overflow:hidden;}
.bar .fill{height:100%;background:var(--gold);border-radius:99px;}
.rev{border-top:1px solid var(--line);padding:18px 0;}
.rev:last-of-type{padding-bottom:0;}
.rev-h{display:flex;align-items:center;gap:11px;margin-bottom:8px;}
.rev-av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;}
.rev-n{font-size:14px;font-weight:700;color:var(--ink);}
.rev-m{font-size:12px;color:var(--faint);}
.rev-s{margin-left:auto;color:var(--gold);font-size:12.5px;letter-spacing:1.5px;}
.rev-b{font-size:14.5px;line-height:1.72;color:var(--body-c);}
.rev-tag{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);background:var(--chipbg);border-radius:999px;padding:4px 10px;}
.demo-note{font-size:12px;color:var(--faint);margin-top:16px;}


/* ---------- booking rail ---------- */
.rail{position:sticky;top:96px;}
.bk{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;
  box-shadow:0 22px 56px rgba(30,49,69,.10);}
.bk-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chipbg);
  border-radius:999px;padding:4px;margin-bottom:18px;}
.bk-tab{border-radius:999px;padding:11px 6px;font-size:13px;font-weight:700;color:var(--muted);
  line-height:1.25;}
.bk-tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,49,69,.1);}
.bk-tab small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);margin-top:2px;}
.bk-tab.on small{color:var(--gold-deep);}
.bk-price{font-size:30px;font-weight:700;color:var(--ink);line-height:1;}
.bk-price span{font-size:13.5px;font-weight:600;color:var(--muted);}
.bk-note{font-size:13px;color:var(--muted);margin:8px 0 18px;line-height:1.6;}
.bk-sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin:16px 0 9px;}
.mc{border:1px solid var(--line);border-radius:14px;padding:13px;}
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.mc-head b{font-size:14px;font-weight:700;color:var(--ink);}
.mc-nav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);background:#fff;
  font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:center;}
.mc-nav:hover{border-color:var(--ink);} .mc-nav[disabled]{opacity:.3;cursor:default;}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.mc-dow{font-size:9.5px;font-weight:700;color:var(--faint);text-align:center;
  text-transform:uppercase;padding:3px 0;}
.mc-day{height:33px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);
  background:#fff;border:1px solid transparent;}
.mc-day:hover{border-color:var(--gold);}
.mc-day.off{color:var(--faint);opacity:.38;pointer-events:none;}
.mc-day.sel{background:var(--ink);color:#fff;}
.mc-day.blank{visibility:hidden;pointer-events:none;}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;}
.time{border:1px solid var(--line-2);border-radius:10px;padding:10px 5px;text-align:center;
  font-size:13px;font-weight:600;color:var(--ink);background:#fff;}
.time.sel{background:var(--gold);border-color:var(--gold);color:#fff;}
.bk-go{width:100%;padding:14px;font-size:14.5px;margin-top:16px;}
.bk-go[disabled]{opacity:.45;cursor:not-allowed;}
.bk-fine{font-size:11.5px;color:var(--faint);margin-top:10px;text-align:center;line-height:1.6;}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  font-weight:600;font-size:14.5px;transition:all .18s ease;}
.pill-gold{background:var(--gold);color:#fff;}
.pill-gold:hover{background:var(--gold-deep);}
.pill-soft{border:1px solid var(--line-2);color:var(--ink);background:#fff;}
.pill-soft:hover{border-color:var(--ink);}

/* ---- layout (keep last) ---- */
.split{
  display:grid;
  grid-template-columns:minmax(0,1fr) 400px;
  gap:22px;
  align-items:start;
}
.split > .rail{position:sticky;top:96px;align-self:start;}
@media(max-width:980px){
  .split{grid-template-columns:1fr;}
  .split > .rail{position:static;}
}

@media(max-width:700px){
  .page{padding:78px 14px 70px;}
  .card{padding:18px;border-radius:16px;}
  .idc{gap:18px;}
  .id-meta{gap:6px;}
  .mchip{padding:7px 11px;font-size:12px;}
  .rsum{gap:16px;}
  .rscore{font-size:38px;}
  .rscale button{width:44px;height:44px;}
  .rscale{gap:6px;}
  .bk{padding:18px;}
  .mc{padding:9px;}
  .mc-day{height:38px;}   /* bigger tap target */
  .times,.bp-times{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));}
}
</style>
</head>

<script>
'use strict';


/* ---------------- per-advisor written content ---------------- */

const REVIEWS=[
 {n:'Margaret H.',w:'2 weeks ago',s:5,t:'Patient and thorough',
  b:a=>`I have had people "fix" my computer before and leave me more confused than when they arrived. ${a.name.split(' ')[0]} explained every step and wrote down what to do if it happens again. Worth every penny.`},
 {n:'Tom R.',w:'1 month ago',s:5,t:'Fast response',

    <h2>Who you'll be <em>working with</em></h2>
    <p style="margin-top:14px">${a.bio}</p>
    <p>My working style is best described as <b>${a.personality.toLowerCase()}</b>. I work mainly with
      ${a.platforms.join(' and ')} households${a.business?' and small businesses':''}, and I am
      ${a.evenings&&a.weekends?'available evenings and weekends as well as weekdays'
        :a.evenings?'available in the evenings as well as during the day'
        :a.weekends?'available at weekends as well as during the week':'available during weekday hours'}.</p>
    <div class="id-specs" style="border-top:1px solid var(--line);margin-top:18px;padding-top:16px">
      <div class="t">Can help you plan for</div>
      <div class="chips">${a.futures.map(f=>`<span class="chip">${f}</span>`).join('')}</div>
    </div>
  </section>


  <!-- how they work -->
  <section class="card">
    <div class="c-label">How I work</div>
    <h2>What a visit with me <em>looks like</em></h2>
    <div class="works">
      ${v.how.map((w,i)=>`<div class="work"><span class="n">${i+1}</span>
        <div><h4>${['Before we touch anything','During the visit','Before I leave'][i]||'Afterwards'}</h4>
        <p>${w}</p></div></div>`).join('')}
      <div class="work"><span class="n">${v.how.length+1}</span>
        <div><h4>Afterwards</h4>
        <p>Follow-up on anything we worked on together is included${a.checkins
          ?', and I offer recurring check-ins so small problems get caught before they become the reason you call'
          :''}. I keep private notes on your setup, so a second visit never starts from zero.</p></div></div>
    </div>
  </section>


  <!-- qualifications -->
  <section class="card">
    <div class="c-label">Qualifications</div>
    <h2>Training and <em>credentials</em></h2>
    <div class="quals" style="margin-top:16px">
      ${q.map(([yr,t,d])=>`<div class="qual"><div class="yr">${yr}</div>
        <h4>${t}</h4><p>${d}</p></div>`).join('')}
    </div>
    <div class="verified">
      <span class="tick">✓</span>
      <span><b>Verified by Greylock Trust</b> </span>
    </div>
  </section>


  <!-- ratings -->
  <section class="card">
    <div class="c-label">Ratings &amp; reviews</div>
    <div class="rsum">
      <div>
        <div class="rscore">${a.rating.toFixed(1)}<span>/5</span></div>
        <div class="rcount">${a.reviews} verified reviews</div>
      </div>
      <div class="bars">
        ${[5,4,3,2,1].map(n=>`<div class="bar"><span class="t">${n}</span>
          <span class="track"><span class="fill" style="width:${(DIST[n]*100).toFixed(0)}%"></span></span>
          <span>${Math.round(DIST[n]*a.reviews)}</span></div>`).join('')}
     </div>
    </div>
    <div id="revList"></div>
    <form class="rf" id="revForm" novalidate>
      <div>
        <label>Your rating (1–5)</label>
        <div class="rscale" id="revScale">
          ${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">${n}</button>`).join('')}
        </div>
        <span class="rf-msg" id="mScale">Please choose a rating from 1 to 5.</span>
      </div>
      <div><label>Your name<input id="revName" type="text" autocomplete="name"></label>
        <span class="rf-msg" id="mName">Please enter your name.</span></div>
      <div><label>Your review<textarea id="revBody" rows="4"
        placeholder="What was the session like?"></textarea></label>
        <span class="rf-msg" id="mBody">Please write at least a sentence.</span></div>
      <button class="pill pill-gold" type="submit" style="padding:13px">Post review</button>
      <span class="rf-ok" id="revOk">Thanks — your review is posted below.</span>
    </form> 
  </section>`;


/* ---------------- booking rail ---------------- */
let B={mode:a.intro?'intro':'session',date:null,mView:null,time:null,
       step:'when',meet:'',name:'',email:'',phone:'',address:'',notes:'',done:false};
       
       function drawRail(){
  const intro=B.mode==='intro';
  if(B.done){ drawDone(); return; }
  if(B.step==='details'){ drawDetails(); return; }
  if(!B.mView){const n=new Date();B.mView=new Date(n.getFullYear(),n.getMonth(),1);}
  if(!B.date){const p=new Date();p.setHours(0,0,0,0);
    for(let i=1;i<=40;i++){p.setDate(p.getDate()+1);
      if(availFor(a,p,intro).length){B.date=new Date(p);
        B.mView=new Date(p.getFullYear(),p.getMonth(),1);break;}}}
  const mv=B.mView,y=mv.getFullYear(),mo=mv.getMonth();
  const fd=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  const today=new Date();today.setHours(0,0,0,0);
  const prevOk=mv>new Date(today.getFullYear(),today.getMonth(),1);
  let cells='';
  for(let i=0;i<fd;i++)cells+='<button class="mc-day blank"></button>';
  for(let d=1;d<=dim;d++){
    const date=new Date(y,mo,d),av=availFor(a,date,intro).length;
    const sel=B.date&&date.getTime()===new Date(B.date).setHours(0,0,0,0);
    cells+=`<button class="mc-day ${av?'':'off'} ${sel?'sel':''}" data-d="${date.toISOString()}">${d}</button>`;
  }
  const times=B.date?availFor(a,new Date(B.date),intro):[];
  document.getElementById('rail').innerHTML=`
    ${a.intro?`<div class="bk-tabs">
      <button class="bk-tab ${intro?'on':''}" data-mode="intro">Intro call<small>20 min · free</small></button>
      <button class="bk-tab ${intro?'':'on'}" data-mode="session">Full session<small>$${a.rate}/hour</small></button>
    </div>`:''}
    <div class="bk-price">${intro?'Free':'$'+a.rate+'<span>/hour</span>'}</div>
    <p class="bk-note">${intro
      ? 'Twenty minutes to meet '+a.name.split(' ')[0]+', describe the problem, and decide afterwards. Held virtually.'
      : 'Billed to the minute after the first hour. '+(a.onsite?(a.remote?'In person or virtual — your choice at booking.':'In person, at your address.'):'Held virtually over screen share.')}</p>
    <div class="bk-sec">1 · Pick a day</div>
    <div class="mc">
      <div class="mc-head">
        <button class="mc-nav" id="mcPrev" ${prevOk?'':'disabled'}>‹</button>
        <b>${MONTHS[mo]} ${y}</b>
        <button class="mc-nav" id="mcNext">›</button>
      </div>
      <div class="mc-grid">${DOW.map(d=>`<div class="mc-dow">${d[0]}</div>`).join('')}${cells}</div>
    </div>
    <div class="bk-sec">2 · ${B.date?dLabel(new Date(B.date)):'Pick a time'}</div>
    <div class="times">${times.map(t=>
      `<button class="time ${t===B.time?'sel':''}" data-t="${t}">${t}</button>`).join('')||
      '<span style="font-size:13px;color:var(--faint)">Choose an available day above.</span>'}</div>
<button class="pill pill-gold bk-go" id="go" ${B.time?'':'disabled'}>
      ${B.time?'Continue — '+dLabel(new Date(B.date))+' at '+B.time:'Select a time to continue'}</button>
          <p class="bk-fine">${intro?'Nothing is charged for an intro call.'
      :'Nothing is charged until after the session.'} You'll enter your details on the next step.</p>`;


  document.querySelectorAll('.bk-tab').forEach(b=>b.addEventListener('click',()=>{
Object.assign(B,{mode:b.dataset.mode,date:null,mView:null,time:null,step:'when',done:false});drawRail();}));
  const pv=document.getElementById('mcPrev');
  if(pv&&prevOk)pv.addEventListener('click',()=>{B.mView=new Date(y,mo-1,1);drawRail();});
  document.getElementById('mcNext').addEventListener('click',()=>{B.mView=new Date(y,mo+1,1);drawRail();});
  document.querySelectorAll('.mc-day:not(.off):not(.blank)').forEach(b=>b.addEventListener('click',()=>{
    B.date=new Date(b.dataset.d);B.time=null;drawRail();}));
  document.querySelectorAll('.time').forEach(b=>b.addEventListener('click',()=>{
    B.time=b.dataset.t;drawRail();}));
    const go=document.getElementById('go');
  if(go&&B.time)go.addEventListener('click',()=>{
    B.meet = B.mode==='intro' ? 'remote' : (a.onsite ? (a.remote ? '' : 'onsite') : 'remote');
    B.step='details'; drawRail();
  });
}

drawRail();

function needsAddress(){ return B.meet==='onsite'||B.meet==='both'; }
function v2(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function mark(id,msg,pass){
  const el=document.getElementById(id), m=document.getElementById(msg);
  if(el)el.classList.toggle('err',!pass);
  if(m)m.classList.toggle('on',!pass);
  return pass;
}
function ymd(d){
  const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}

function drawDetails(){
  const intro=B.mode==='intro';
  const modeSeg = intro
    ? `<p style="font-size:13px;color:var(--muted)">Intro calls are
        <b style="color:var(--ink)">virtual</b> — we'll email you a link.</p>`
    : (a.onsite&&a.remote)
    ? `<div><label>How would you like to meet?</label>
        <div class="bk-tabs" style="margin-top:6px">
          <button type="button" class="bk-tab ${B.meet==='onsite'?'on':''}" data-m="onsite">In person</button>
          <button type="button" class="bk-tab ${B.meet==='remote'?'on':''}" data-m="remote">Virtual</button>
        </div></div>`
    : `<p style="font-size:13px;color:var(--muted)">This advisor meets
        <b style="color:var(--ink)">${a.onsite?'in person':'virtually'}</b>.</p>`;

  document.getElementById('rail').innerHTML=`
    <div class="bk-sec">Your details</div>
    <div style="background:var(--bg);border:1px solid var(--line);border-radius:12px;
                padding:11px 13px;font-size:13px;margin-bottom:14px">
      <b style="color:var(--ink)">${dLabel(new Date(B.date))} at ${B.time}</b>
      <button id="changeWhen" style="float:right;font-size:12px;color:var(--gold-deep);
        font-weight:700">Change</button>
    </div>
    <div id="railWarn"></div>
    <form class="rf" id="bkForm" style="border-top:none;margin-top:0;padding-top:0" novalidate>
      ${modeSeg}
      <div><label>Full name<input id="bName" type="text" value="${B.name}" autocomplete="name"></label>
        <span class="rf-msg" id="mBName">Please enter your name.</span></div>
      <div><label>Email<input id="bEmail" type="email" value="${B.email}" autocomplete="email"></label>
        <span class="rf-msg" id="mBEmail">Please enter a valid email.</span></div>
      <div><label>Phone<input id="bPhone" type="tel" value="${B.phone}" autocomplete="tel"></label>
        <span class="rf-msg" id="mBPhone">Please enter a phone number.</span></div>
      ${needsAddress()?`<div><label>Address<input id="bAddr" type="text" value="${B.address}"
        autocomplete="street-address"></label>
        <span class="rf-msg" id="mBAddr">We need an address for in-person visits.</span></div>`:''}
      <div><label>Anything we should know? <span style="font-weight:500;color:var(--muted)">(optional)</span>
        <textarea id="bNotes" rows="3">${B.notes}</textarea></label></div>
      <button class="pill pill-gold" type="submit" style="padding:14px;width:100%">
        ${intro?'Confirm free intro call':'Confirm booking'}</button>
    </form>
    <p class="bk-fine">${intro?'Nothing is charged for an intro call.'
      :'Nothing is charged until after the session.'}</p>`;

  document.getElementById('changeWhen').addEventListener('click',()=>{B.step='when';drawRail();});
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{
    B.meet=b.dataset.m;
    B.name=v2('bName');B.email=v2('bEmail');B.phone=v2('bPhone');
    B.address=v2('bAddr');B.notes=v2('bNotes');
    drawDetails();
  }));

  document.getElementById('bkForm').addEventListener('submit', async e=>{
    e.preventDefault();
    B.name=v2('bName');B.email=v2('bEmail');B.phone=v2('bPhone');
    B.address=v2('bAddr');B.notes=v2('bNotes');
    let ok=true;
    ok=mark('bName','mBName',B.name.length>=2)&&ok;
    ok=mark('bEmail','mBEmail',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(B.email))&&ok;
    ok=mark('bPhone','mBPhone',B.phone.replace(/[^0-9]/g,'').length>=7)&&ok;
    if(needsAddress())ok=mark('bAddr','mBAddr',B.address.length>=6)&&ok;
    if(!ok)return;

    const btn=e.target.querySelector('button[type=submit]');
    btn.disabled=true; btn.textContent='Saving…';

    const { data:{ session } } = await GT_AUTH.SB.auth.getSession();
    const { error } = await GT_AUTH.SB.from('bookings').insert({
      client_id: session ? session.user.id : null,
      advisor_id: a.id,
      kind: B.mode==='intro'?'intro':'session',
      mode: B.meet==='onsite'?'In-person':'Video call',
      day: ymd(B.date),
      slot: B.time,
      name:B.name, email:B.email, phone:B.phone,
      address: B.meet==='onsite'?B.address:null,
      notes:B.notes, status:'confirmed'
    });

    if(error){
      console.error('[GT] booking not saved:', error);
      const w=document.getElementById('railWarn');
      const taken = error.code==='23505';
      if(w) w.innerHTML=`<div style="margin-bottom:13px;padding:11px 13px;border-radius:11px;
        font-size:13px;line-height:1.5;background:#FFF4F1;border:1px solid #E8B8AC;color:#B4452F">
        ${taken?"That time was just taken. Pick another and we'll get you booked."
               :"We couldn't save that booking. Please email team@greylocktrust.com."}</div>`;
      if(taken){ B.time=null; B.step='when'; drawRail(); return; }
      btn.disabled=false;
      btn.textContent = B.mode==='intro'?'Confirm free intro call':'Confirm booking';
      return;
    }

    try{
      await GT_AUTH.SB.functions.invoke('send-confirmation-email',{
        body:{ email:B.email, name:B.name, advisor:a.name,
               day:dLabel(new Date(B.date)), time:B.time,
               mode:B.meet==='onsite'?'In-person':'Video call',
               kind:B.mode==='intro'?'intro':'session' }
      });
    }catch(err){ console.warn('[GT] confirmation email failed:', err); }

    B.done=true; drawRail();
  });
}

function drawDone(){
  document.getElementById('rail').innerHTML=`
    <div style="text-align:center;padding:10px 4px">
      <div class="tick" style="width:54px;height:54px;border-radius:50%;
        background:var(--gold-wash);border:1px solid var(--gold-line);color:var(--gold-deep);
        font-size:24px;display:flex;align-items:center;justify-content:center;
        margin:0 auto 14px">✓</div>
      <h4 style="font-size:19px;font-weight:700;color:var(--ink);margin-bottom:7px">
        You're booked with ${a.name.split(' ')[0]}</h4>
      <p style="font-size:14px;color:var(--muted);line-height:1.7">
        ${dLabel(new Date(B.date))} at ${B.time}<br>
        ${B.meet==='onsite'?'In person, at your address':'Virtual — link sent by email'}</p>
      <p style="margin-top:12px;font-size:13px;color:var(--muted)">
        A confirmation is on its way to ${B.email}.</p>
      <a class="pill pill-soft" href="marketplace.html#returning"
        style="margin-top:16px;width:100%;padding:12px">Back to advisors</a>
    </div>`;
}

/* ---------------- reviews ---------------- */
const RKEY='greylockReviews:'+a.id;
let myRating=0;

function mine(){try{return JSON.parse(localStorage.getItem(RKEY))||[];}catch(e){return[];}}
function saveMine(l){try{localStorage.setItem(RKEY,JSON.stringify(l));}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function initialsOf(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}

function revCard(n,when,rating,tag,body){
  return `<div class="rev">
    <div class="rev-h">
      <div class="rev-av">${esc(initialsOf(n))}</div>
      <div><div class="rev-n">${esc(n)}</div><div class="rev-m">${esc(when)}</div></div>
      <span class="rnum">${rating}/5</span>
    </div>
    <p class="rev-b">${esc(body)}</p>
    ${tag?`<span class="rev-tag">${esc(tag)}</span>`:''}
  </div>`;
}

function drawReviews(){
  const posted=mine().map(r=>revCard(r.n,r.when,r.s,'',r.b)).join('');
  const demo=REVIEWS.map(r=>revCard(r.n,r.w,r.s,r.t,typeof r.b==='function'?r.b(a):r.b)).join('');
  document.getElementById('revList').innerHTML=posted+demo;
}
drawReviews();

document.querySelectorAll('#revScale button').forEach(b=>b.addEventListener('click',()=>{
  myRating=+b.dataset.n;
  document.querySelectorAll('#revScale button')
    .forEach(x=>x.classList.toggle('on',+x.dataset.n===myRating));
  document.getElementById('mScale').classList.remove('on');
}));

document.getElementById('revForm').addEventListener('submit',e=>{
  e.preventDefault();
  const nameEl=document.getElementById('revName'),bodyEl=document.getElementById('revBody');
  const n=nameEl.value.trim(),b=bodyEl.value.trim();
  let ok=true;
  const flag=(el,msg,pass)=>{
    if(el)el.classList.toggle('err',!pass);
    document.getElementById(msg).classList.toggle('on',!pass);
    return pass;
  };
  ok=flag(null,'mScale',myRating>=1&&myRating<=5)&&ok;
  ok=flag(nameEl,'mName',n.length>=2)&&ok;
  ok=flag(bodyEl,'mBody',b.length>=15)&&ok;
  if(!ok)return;

  saveMine([{n,b,s:myRating,when:'Just now'},...mine()]);
  nameEl.value='';bodyEl.value='';myRating=0;
  document.querySelectorAll('#revScale button').forEach(x=>x.classList.remove('on'));
  document.getElementById('revOk').classList.add('on');
  setTimeout(()=>document.getElementById('revOk').classList.remove('on'),4000);
  drawReviews();
});
</script>
</body>
</html>
