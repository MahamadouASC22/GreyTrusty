<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow"><title>Your dashboard — Greylock Trust</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
:root{ --serif:'Fraunces',Georgia,serif; }
body{background:var(--bg);}
.dash{max-width:1300px;margin:0 auto;padding:calc(88px + 1vw) 24px 80px;}


/* ---------- greeting ---------- */
.greet{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.greet .who{display:flex;align-items:center;gap:16px;}
.greet img,.greet .fb{width:62px;height:62px;border-radius:16px;object-fit:cover;}
.greet .fb{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:600;}
.greet h1{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,38px);
  color:var(--ink);letter-spacing:-.03em;line-height:1.05;}
.greet h1 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.greet .sub{font-size:14px;color:var(--muted);margin-top:5px;}
.greet .act{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  font-weight:600;font-size:13.5px;padding:11px 18px;transition:all .18s ease;}
.pill-gold{background:var(--gold);color:#fff;} .pill-gold:hover{background:var(--gold-deep);}
.pill-soft{border:1px solid var(--line-2);color:var(--ink);background:#fff;}
.pill-soft:hover{border-color:var(--ink);}
.pill-ink{background:var(--ink);color:#fff;} .pill-ink:hover{background:var(--ink-2);}


/* ---------- status strip ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:900px){.strip{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.strip{grid-template-columns:1fr;}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
.stat .v{font-size:27px;font-weight:700;color:var(--ink);line-height:1;margin:9px 0 4px;}
.stat .v small{font-size:13px;font-weight:600;color:var(--muted);}
.stat .n{font-size:12.5px;color:var(--muted);}
.stat.gold{background:var(--gold-wash);border-color:var(--gold-line);}
.stat.gold .v{color:var(--gold-deep);}


/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
@media(max-width:1040px){.cols{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:20px;}
.card:last-child{margin-bottom:0;}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.ch h2{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--ink);letter-spacing:-.02em;}
.ch .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--gold-deep);}
.ch .more:hover{text-decoration:underline;text-underline-offset:3px;}


/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--chipbg);border-radius:999px;padding:4px;margin-bottom:18px;
  overflow-x:auto;}
.tab{border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,49,69,.09);}
.tab .badge{display:inline-block;margin-left:6px;background:var(--gold);color:#fff;border-radius:999px;
  font-size:10.5px;padding:1px 7px;}


/* ---------- appointment rows ---------- */
.appt{display:flex;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
.appt:last-child{border-bottom:none;}
.appt .when{width:78px;flex:none;text-align:center;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:9px 4px;}
.appt .when .d{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.appt .when .n{font-size:20px;font-weight:700;color:var(--ink);line-height:1.1;}
.appt .when .t{font-size:11.5px;color:var(--muted);}
.appt .who2{min-width:0;}
.appt .nm{font-size:15.5px;font-weight:700;color:var(--ink);}
.appt .meta{font-size:13px;color:var(--muted);margin-top:3px;}
.appt .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.tg{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--chipbg);border-radius:999px;padding:4px 9px;color:var(--muted);}
.tg.gold{background:var(--gold-wash);color:var(--gold-deep);}
.tg.ink{background:var(--ink);color:#fff;}
.appt .go{margin-left:auto;flex:none;display:flex;gap:7px;}
.appt .go .pill{padding:9px 14px;font-size:12.5px;}
@media(max-width:640px){.appt{flex-wrap:wrap;}.appt .go{margin-left:0;width:100%;}}


/* ---------- matches ---------- */
.match{display:flex;gap:14px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);}
.match:last-child{border-bottom:none;}
.match .ring{width:50px;height:50px;flex:none;position:relative;}
.match .ring svg{width:50px;height:50px;transform:rotate(-90deg);}
.match .ring .bgc{stroke:var(--line);} .match .ring .arc{stroke:var(--gold);stroke-linecap:round;}
.match .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;color:var(--ink);}
.match .nm{font-size:15px;font-weight:700;color:var(--ink);}
.match .need{font-size:13.5px;color:var(--body-c);margin-top:3px;line-height:1.6;}
.match .meta{font-size:12.5px;color:var(--faint);margin-top:5px;}
.match .go{margin-left:auto;flex:none;}


/* ---------- availability ---------- */
.avail{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.day{border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;
  background:#fff;transition:all .18s ease;}
.day .dw{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.day .hrs{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.35;}
.day.off{background:var(--bg);} .day.off .hrs{color:var(--faint);font-weight:600;}
.day.on{border-color:var(--gold);background:var(--gold-wash);}
.day.on .hrs{color:var(--gold-deep);}
@media(max-width:640px){.avail{grid-template-columns:repeat(4,1fr);}}
.togs{display:grid;gap:11px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.tog{display:flex;align-items:center;gap:12px;}
.tog .lab{font-size:14px;font-weight:600;color:var(--ink);}
.tog .lab small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px;}
.sw{margin-left:auto;width:44px;height:25px;border-radius:99px;background:var(--line-2);
  position:relative;flex:none;transition:background .22s ease;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .22s ease;box-shadow:0 2px 6px rgba(30,49,69,.2);}
.sw.on{background:var(--gold);} .sw.on::after{transform:translateX(19px);}


/* ---------- right rail ---------- */
.mini{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;}
.mini h3{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px;}
.pay{background:linear-gradient(155deg,var(--ink-deep),var(--ink));color:#fff;position:relative;
  overflow:hidden;border:none;}
.pay::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(195,144,60,.28),transparent 66%);}
.pay>*{position:relative;z-index:1;}
.pay h3{color:var(--gold-line);}
.pay .amt{font-size:34px;font-weight:700;line-height:1;}
.pay .sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:5px;}
.pay .rows{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);}
.pay .r{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;
  color:rgba(255,255,255,.78);} .pay .r b{color:#fff;}
.prof-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--body-c);}
.prof-row:last-child{border-bottom:none;}
.prof-row b{color:var(--ink);margin-left:auto;font-weight:700;}
.bar{height:7px;background:var(--chipbg);border-radius:99px;overflow:hidden;margin:12px 0 8px;}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;}
.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--body-c);line-height:1.55;}
.task:last-child{border-bottom:none;}
.task .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none;margin-top:6px;}
.task.done{color:var(--faint);text-decoration:line-through;}
.task.done .dot{background:var(--line-2);}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px;}
.demo{font-size:11.5px;color:var(--faint);text-align:center;margin-top:22px;}
</style>
</head>
<body class="nav-dark">
<div id="nav"></div>


<main class="dash">
  <div class="greet" id="greet"></div>
  <div class="strip" id="strip"></div>
  <div class="cols">
    <div>
      <section class="card">
        <div class="tabs" id="tabs"></div>
        <div id="apptList"></div>
      </section>


      <section class="card">
        <div class="ch"><h2>New matches</h2>
          <span class="more" id="matchNote"></span></div>
        <div id="matchList"></div>
      </section>


      <section class="card">
        <div class="ch"><h2>Your week</h2>
          <a class="more" href="#" id="editHours">Edit hours</a></div>
        <div class="avail" id="avail"></div>
        <div class="togs" id="togs"></div>
      </section>
    </div>


    <aside>
      <div class="mini pay" id="pay"></div>
      <div class="mini" id="profileCard"></div>
      <div class="mini" id="tasks"></div>
    </aside>
  </div>
<p class="demo">Bookings are live. Payouts and client matching are not wired up yet.</p>
</main>


<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
'use strict';

const $ = id => document.getElementById(id);

(async function boot(){
  const r = await GT_AUTH.requireAdvisor();
  if(!r) return;                       // already redirecting to the portal

  if(r.blocked){
    document.querySelector('.dash').innerHTML = `
      <div class="card" style="max-width:560px;margin:0 auto;text-align:center">
        <h2 style="font-family:var(--serif);font-weight:400;font-size:22px;
                   color:var(--ink);margin-bottom:10px">Almost there</h2>
        <p style="font-size:14.5px;color:var(--muted);line-height:1.7">
          You're signed in as <b>${r.session.email}</b>, but there's no advisor
          profile attached to this account yet. If you've just been approved,
          we're still building your page — you'll get an email the moment it's live.</p>
        <a class="pill pill-soft" href="index.html"
           style="margin-top:18px">Back to the site</a>
      </div>`;
    return;
  }

  render(r.advisor);
})();


async function render(me){
  const first = (me.name||'').split(' ')[0];
  const hour  = new Date().getHours();
  const part  = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const specs = me.specs || [];

  /* ---------------- greeting ---------------- */
  $('greet').innerHTML = `
    <div class="who">
      ${me.photo_url
        ? `<img src="${me.photo_url}" alt="">`
        : `<div class="fb">${GT_AUTH.initials(me.name)}</div>`}
      <div>
        <h1>${part}, <em>${first}.</em></h1>
        <p class="sub">${me.title||'Privacy Advisor'} · $${me.rate}/hour ·
          ${me.published?'Profile live and accepting bookings':'Profile not published yet'}</p>
      </div>
    </div>
    <div class="act">
      <a class="pill pill-soft" href="advisor.html?id=${me.id}#a=${me.id}">View public profile</a>
      <a class="pill pill-gold" href="#" id="addTime">Add availability</a>
    </div>`;

  /* ---------------- real bookings ---------------- */
  let rows = [];
  const { data, error } = await GT_AUTH.SB.from('bookings')
    .select('*').eq('advisor_id', me.id).order('day', { ascending:true });
  if(error) console.warn('[GT] bookings load failed:', error.message);
  else rows = data || [];

  const today = ymdLocal(new Date());
  const upcoming = rows.filter(b => b.day && b.day >= today && b.status !== 'cancelled');
  const past     = rows.filter(b => !b.day || b.day < today || b.status === 'cancelled');

  /* ---------------- status strip ---------------- */
  const weekEnd = ymdLocal(new Date(Date.now() + 7*864e5));
  const thisWeek = upcoming.filter(b => b.day <= weekEnd);
  $('strip').innerHTML = `
    <div class="stat"><div class="k">Next 7 days</div>
      <div class="v">${thisWeek.filter(b=>b.kind!=='intro').length}</div>
      <div class="n">booked sessions</div></div>
    <div class="stat"><div class="k">Intro calls</div>
      <div class="v">${thisWeek.filter(b=>b.kind==='intro').length}</div>
      <div class="n">free, 20 minutes each</div></div>
    <div class="stat gold"><div class="k">All upcoming</div>
      <div class="v">${upcoming.length}</div><div class="n">on your calendar</div></div>
    <div class="stat"><div class="k">Your rating</div>
      <div class="v">${Number(me.rating||0).toFixed(1)}<small>/5</small></div>
      <div class="n">across ${me.reviews||0} reviews</div></div>`;

  /* ---------------- appointments ---------------- */
  let tab = 'upcoming';

  function drawTabs(){
    $('tabs').innerHTML = `
      <button class="tab ${tab==='upcoming'?'on':''}" data-t="upcoming">Upcoming<span class="badge">${upcoming.length}</span></button>
      <button class="tab ${tab==='past'?'on':''}" data-t="past">Past</button>`;
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
      tab=b.dataset.t; drawTabs(); drawAppts();
    }));
  }

  function when(b){
    if(!b.day) return ['—','', b.slot||''];
    const [y,m,d] = b.day.split('-').map(Number);
    const dt = new Date(y, m-1, d);          // local, avoids the UTC day shift
    return [DOW[dt.getDay()], String(d), b.slot || ''];
  }

  function drawAppts(){
    const list = tab==='upcoming' ? upcoming : past;
    if(!list.length){
      $('apptList').innerHTML = `<div class="empty">${tab==='upcoming'
        ? 'Nothing booked yet. New bookings land here the moment a client confirms.'
        : 'No past appointments yet.'}</div>`;
      return;
    }
    $('apptList').innerHTML = list.map(b=>{
      const w = when(b);
      return `
      <div class="appt">
        <div class="when"><div class="d">${w[0]}</div><div class="n">${w[1]}</div>
          <div class="t">${w[2]}</div></div>
        <div class="who2">
          <div class="nm">${esc(b.name || 'Client')}</div>
          <div class="meta">${esc(b.notes || 'No notes provided')}</div>
          <div class="tags">
            <span class="tg ${b.kind==='intro'?'gold':''}">${b.kind==='intro'?'Intro call':'Session'}</span>
            <span class="tg">${esc(b.mode||'')}</span>
            ${b.address?`<span class="tg">${esc(b.address)}</span>`:''}
            ${b.status==='cancelled'?'<span class="tg ink">Cancelled</span>':''}
          </div>
        </div>
        <div class="go">
          <a class="pill pill-soft" href="mailto:${encodeURIComponent(b.email||'')}">Email</a>
          ${tab==='upcoming'?`<button class="pill pill-ink" data-cancel="${b.id}">Cancel</button>`:''}
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('[data-cancel]').forEach(btn=>
      btn.addEventListener('click', async ()=>{
        if(!confirm('Cancel this booking? The client is not emailed automatically.')) return;
        btn.disabled = true;
        const { error } = await GT_AUTH.SB.from('bookings')
          .update({ status:'cancelled' }).eq('id', btn.dataset.cancel);
        if(error){ alert('Could not cancel: '+error.message); btn.disabled=false; return; }
        location.reload();
      }));
  }
  drawTabs(); drawAppts();

  /* ---------------- availability (from your own row) ---------------- */
  const WK=[['Mon','9–5'],['Tue','9–5'],['Wed','9–5'],['Thu',me.evenings?'9–7':'9–5'],
            ['Fri','9–3'],['Sat',me.weekends?'10–2':'Off'],['Sun','Off']];
  $('avail').innerHTML = WK.map(([d,h])=>`
    <div class="day ${h==='Off'?'off':'on'}"><div class="dw">${d}</div>
      <div class="hrs">${h}</div></div>`).join('');

  const TOGS=[
   ['intro','Offer free 20-minute intro calls','Shown as a gold badge on your profile',me.intro],
   ['evenings','Available evenings','Adds 6pm and 7pm slots on weekdays',me.evenings],
   ['weekends','Available weekends','Opens Saturday bookings',me.weekends],
   ['checkins','Offer recurring check-ins','Clients can book you quarterly',me.checkins],
   ['business','Take small-business work','Appears in the business support filter',me.business],
  ];
  $('togs').innerHTML = TOGS.map(([k,t,s,on])=>`
    <div class="tog"><div class="lab">${t}<small>${s}</small></div>
      <button class="sw ${on?'on':''}" data-k="${k}" aria-label="${t}"></button></div>`).join('');

  document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click', async ()=>{
    const on = !b.classList.contains('on');
    b.classList.toggle('on', on);
    const { error } = await GT_AUTH.SB.from('advisors')
      .update({ [b.dataset.k]: on }).eq('id', me.id);
    if(error){ b.classList.toggle('on', !on); alert('Could not save: '+error.message); }
  }));

  /* ---------------- earnings (real bookings, your real rate) ---------------- */
  const billable = past.filter(b => b.kind !== 'intro' && b.status !== 'cancelled').length;
  const gross = billable * me.rate, fee = gross*.15, net = gross-fee;
  $('pay').innerHTML = `
    <h3>Earned so far</h3>
    <div class="amt">$${net.toFixed(0)}</div>
    <div class="sub">${billable} completed session${billable===1?'':'s'} · payouts not yet automated</div>
    <div class="rows">
      <div class="r"><span>Billed to clients</span><b>$${gross.toFixed(0)}</b></div>
      <div class="r"><span>Platform fee (15%)</span><b>−$${fee.toFixed(0)}</b></div>
      <div class="r"><span>Your rate</span><b>$${me.rate}/hr</b></div>
    </div>`;

  /* ---------------- profile strength ---------------- */
  const checks = [
    ['Headshot', !!me.photo_url],
    ['Biography', !!(me.bio && me.bio.length>60)],
    ['Specialties', specs.length>0],
    ['Hourly rate', !!me.rate],
    ['Published', me.published],
  ];
  const pct = Math.round(checks.filter(c=>c[1]).length/checks.length*100);
  $('profileCard').innerHTML = `
    <h3>Profile strength</h3>
    <div style="font-size:24px;font-weight:700;color:var(--ink)">${pct}%</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Stronger profiles appear
      higher for the clients they genuinely fit.</p>
    ${checks.map(([t,ok])=>`<div class="prof-row"${ok?'':' style="color:var(--gold-deep)"'}>${t}
      <b${ok?'':' style="color:var(--gold-deep)"'}>${ok?'Added':'To do'}</b></div>`).join('')}
    <p style="font-size:12px;color:var(--faint);margin-top:14px;line-height:1.6">
      Profile copy is written and verified by Greylock. Email us to request a change.</p>`;

  /* ---------------- needs you ---------------- */
  const soon = upcoming.slice(0,3);
  $('tasks').innerHTML = `<h3>Needs you</h3>` + (soon.length
    ? soon.map(b=>`<div class="task"><span class="dot"></span><span>Prepare for
        <b>${esc(b.name||'your client')}</b> — ${esc(b.day_label||'')} ${esc(b.time_label||'')}</span></div>`).join('')
    : `<div class="task"><span class="dot"></span><span>Nothing outstanding.</span></div>`);

  document.querySelectorAll('#matchList, #matchNote').forEach(el=>el.innerHTML='');
  const mc = document.getElementById('matchList');
  if(mc) mc.innerHTML = `<div class="empty">Client matching isn't switched on yet.</div>`;

  ['addTime','editHours'].forEach(id=>{
    const el = $(id);
    if(el) el.addEventListener('click', e=>{ e.preventDefault();
      alert('Availability editing is coming — use the toggles below for now.'); });
  });
}

function ymdLocal(d){
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}

function esc(s){
  return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
