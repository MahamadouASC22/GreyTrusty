<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Your practice — Greylock Trust</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
:root{ --serif:'Fraunces',Georgia,serif; }
.dash{max-width:1300px;margin:0 auto;padding:calc(88px + 1vw) 24px 80px;}

/* ---------- greeting ---------- */
.greet{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
.greet .who{display:flex;align-items:center;gap:16px;}
.greet .av,.greet .fb{width:62px;height:62px;border-radius:16px;object-fit:cover;flex:none;}
.greet .fb{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:22px;font-weight:600;}
.greet h1{font-family:var(--serif);font-weight:300;font-size:clamp(26px,3.2vw,38px);
  color:var(--ink);letter-spacing:-.03em;line-height:1.05;}
.greet h1 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.greet .sub{font-size:14px;color:var(--muted);margin-top:5px;}
.greet .act{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap;}

.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  font-weight:600;font-size:13.5px;padding:11px 18px;transition:all .18s ease;}
.pill-gold{background:var(--gold);color:#fff;} .pill-gold:hover{background:var(--gold-deep);}
.pill-soft{border:1px solid var(--line-2);color:var(--ink);background:#fff;}
.pill-soft:hover{border-color:var(--ink);}
.pill-ink{background:var(--ink);color:#fff;} .pill-ink:hover{background:var(--ink-2);}
.pill-ghost{border:1px solid rgba(255,255,255,.42);color:#fff;background:none;}
.pill-ghost:hover{background:rgba(255,255,255,.12);}
.pill[disabled]{opacity:.45;cursor:not-allowed;}

/* ---------- banner ---------- */
.banner{background:var(--gold-wash);border:1px solid var(--gold-line);border-radius:16px;
  padding:16px 20px;margin-bottom:22px;display:flex;gap:14px;align-items:flex-start;}
.banner i{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--gold-line);
  color:var(--gold-deep);font-style:normal;font-size:12px;font-weight:700;flex:none;
  display:flex;align-items:center;justify-content:center;margin-top:2px;}
.banner b{display:block;font-size:14.5px;color:var(--ink);margin-bottom:3px;}
.banner p{font-size:13.5px;color:var(--body-c);line-height:1.65;}

/* ---------- stats ---------- */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
@media(max-width:900px){.strip{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.strip{grid-template-columns:1fr;}}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;}
.stat .k{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
.stat .v{font-size:27px;font-weight:700;color:var(--ink);line-height:1;margin:9px 0 4px;}
.stat .n{font-size:12.5px;color:var(--muted);}
.stat.gold{background:var(--gold-wash);border-color:var(--gold-line);}
.stat.gold .v{color:var(--gold-deep);}

/* ---------- columns & cards ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;}
@media(max-width:1040px){.cols{grid-template-columns:1fr;}}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;
  margin-bottom:20px;position:relative;}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.ch h2{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--ink);letter-spacing:-.02em;}
.ch .more{margin-left:auto;font-size:13px;font-weight:600;color:var(--gold-deep);}
.ch .more:hover{text-decoration:underline;text-underline-offset:3px;}

/* ---------- appointments ---------- */
.tabs{display:flex;gap:4px;background:var(--chipbg);border-radius:999px;padding:4px;
  margin-bottom:18px;overflow-x:auto;}
.tab{border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:700;color:var(--muted);
  white-space:nowrap;}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(30,49,69,.09);}
.tab .badge{display:inline-block;margin-left:6px;background:var(--gold);color:#fff;
  border-radius:999px;font-size:10.5px;padding:1px 7px;}
.appt{display:flex;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);}
.appt:last-child{border-bottom:none;}
.appt .when{width:78px;flex:none;text-align:center;background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:9px 4px;}
.appt .when .d{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.appt .when .n{font-size:20px;font-weight:700;color:var(--ink);line-height:1.1;}
.appt .when .t{font-size:11.5px;color:var(--muted);}
.appt .who2{min-width:0;}
.appt .nm{font-size:15.5px;font-weight:700;color:var(--ink);}
.appt .meta{font-size:13px;color:var(--muted);margin-top:3px;}
.appt .tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
.tg{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--chipbg);border-radius:999px;padding:4px 9px;color:var(--muted);}
.tg.gold{background:var(--gold-wash);color:var(--gold-deep);}
.tg.ink{background:var(--ink);color:#fff;}
.appt .go{margin-left:auto;flex:none;display:flex;gap:7px;flex-wrap:wrap;}
.appt .go .pill{padding:9px 14px;font-size:12.5px;}
@media(max-width:640px){.appt{flex-wrap:wrap;}.appt .go{margin-left:0;width:100%;}}

/* ---------- week ---------- */
.avail{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
.day{border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;background:#fff;}
.day .dw{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
.day .hrs{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:6px;line-height:1.35;}
.day.off{background:var(--bg);} .day.off .hrs{color:var(--faint);font-weight:600;}
.day.on{border-color:var(--gold);background:var(--gold-wash);}
.day.on .hrs{color:var(--gold-deep);}
@media(max-width:640px){.avail{grid-template-columns:repeat(4,1fr);}}
.togs{display:grid;gap:11px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.tog{display:flex;align-items:center;gap:12px;}
.tog .lab{font-size:14px;font-weight:600;color:var(--ink);}
.tog .lab small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px;}
.sw{margin-left:auto;width:44px;height:25px;border-radius:99px;background:var(--line-2);
  position:relative;flex:none;transition:background .22s ease;}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .22s ease;box-shadow:0 2px 6px rgba(30,49,69,.2);}
.sw.on{background:var(--gold);} .sw.on::after{transform:translateX(19px);}

/* ---------- rail ---------- */
.mini{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;
  margin-bottom:18px;position:relative;}
.mini h3{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px;}
.pay{background:linear-gradient(155deg,var(--ink-deep),var(--ink));color:#fff;position:relative;
  overflow:hidden;border:none;}
.pay::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(195,144,60,.28),transparent 66%);}
.pay>*{position:relative;z-index:1;}
.pay h3{color:var(--gold-line);}
.pay .amt{font-size:34px;font-weight:700;line-height:1;}
.pay .sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:5px;}
.pay .rows{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.16);}
.pay .r{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;
  color:rgba(255,255,255,.78);} .pay .r b{color:#fff;}
.prof-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--body-c);}
.prof-row:last-child{border-bottom:none;}
.prof-row b{color:var(--ink);margin-left:auto;font-weight:700;}
.bar{height:7px;background:var(--chipbg);border-radius:99px;overflow:hidden;margin:12px 0 8px;}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;}
.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--body-c);line-height:1.55;}
.task:last-child{border-bottom:none;}
.task .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--gold);flex:none;margin-top:6px;}

/* ---------- profile editor ---------- */
.ed-intro{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px;max-width:56ch;}
.fld{margin-bottom:16px;}
.fld label{font-size:12.5px;font-weight:700;color:var(--ink);display:block;}
.fld input,.fld textarea{width:100%;margin-top:6px;padding:12px 14px;font-size:14.5px;
  font-family:var(--f);border:1px solid var(--line-2);border-radius:12px;background:var(--bg);
  color:var(--body-c);}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
.fld .hint{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.55;}
.fld .count{float:right;font-size:11.5px;color:var(--faint);font-weight:600;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.two{grid-template-columns:1fr;}}
.ed-sec{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);margin:24px 0 12px;padding-top:20px;border-top:1px solid var(--line);}
.ed-sec:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.chip-b{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:9px 14px;
  font-size:13px;font-weight:600;color:var(--ink);}
.chip-b:hover{border-color:var(--gold);}
.chip-b.on{background:var(--gold);border-color:var(--gold);color:#fff;}
.shot{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.shot .pv,.shot .pv-fb{width:112px;height:128px;border-radius:16px;object-fit:cover;flex:none;}
.shot .pv-fb{background:var(--ink);color:var(--gold);display:flex;align-items:center;
  justify-content:center;font-size:32px;font-weight:600;}
.shot .side{flex:1;min-width:200px;}
.shot .side p{font-size:12.5px;color:var(--muted);line-height:1.65;margin-top:8px;}
input[type=file]{display:none;}
.upbtn{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:11px 20px;
  font-size:13.5px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:8px;}
.upbtn:hover{border-color:var(--ink);}
.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;
  padding-top:18px;border-top:1px solid var(--line);}
.savebar .msg{font-size:13px;color:var(--muted);}
.savebar .sp{margin-left:auto;display:flex;gap:9px;}
.note{font-size:13px;line-height:1.6;margin-top:10px;}
.note.err{color:#B4452F;}
.note.ok{color:var(--gold-deep);}
.chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;font-size:13.5px;
  color:var(--body-c);line-height:1.5;border-bottom:1px solid var(--line);}
.chk:last-of-type{border-bottom:none;}
.chk i{width:18px;height:18px;border-radius:50%;flex:none;font-style:normal;font-size:10px;
  font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.chk.ok i{background:var(--gold-wash);border:1px solid var(--gold-line);color:var(--gold-deep);}
.chk.no i{background:#fff;border:1px solid var(--line-2);color:var(--faint);}
.chk.no{color:var(--muted);}
.pub{background:linear-gradient(155deg,var(--ink-deep),var(--ink));color:#fff;border:none;
  position:relative;overflow:hidden;}
.pub::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;
  border-radius:50%;background:radial-gradient(circle,rgba(195,144,60,.28),transparent 66%);}
.pub>*{position:relative;z-index:1;}
.pub h3{color:var(--gold-line);}
.pub p{font-size:13.5px;color:rgba(255,255,255,.78);line-height:1.7;}
.pub .pill{width:100%;margin-top:14px;padding:13px;}

/* ---------- empty ---------- */
.empty{text-align:center;padding:30px 16px;}
.empty .ic{width:52px;height:52px;border-radius:50%;background:var(--gold-wash);
  border:1px solid var(--gold-line);color:var(--gold-deep);font-size:22px;display:flex;
  align-items:center;justify-content:center;margin:0 auto 14px;}
.empty h4{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin-bottom:8px;}
.empty p{font-size:14px;color:var(--muted);line-height:1.7;max-width:38ch;margin:0 auto;}

/* ---------- note writer sheet ---------- */
.sheet{position:fixed;inset:0;z-index:880;background:rgba(18,34,51,.5);
  display:flex;align-items:center;justify-content:center;padding:24px;}
.sheet-in{background:#fff;border-radius:22px;max-width:520px;width:100%;padding:clamp(22px,3vw,30px);
  box-shadow:0 30px 80px rgba(30,49,69,.3);max-height:88vh;overflow:auto;}
.sheet-in h3{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:5px;}
.sheet-in .sub{font-size:13.5px;color:var(--muted);margin-bottom:18px;}
.sheet-in .row{display:flex;gap:9px;margin-top:8px;}
.sheet-in .row .pill{flex:1;padding:13px;}

/* ---------- layout editing ---------- */
.editbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold-wash);
  border:1px solid var(--gold-line);border-radius:16px;padding:14px 18px;margin-bottom:20px;}
.editbar b{font-size:14px;color:var(--gold-deep);}
.editbar span{font-size:13px;color:var(--body-c);}
.editbar .sp{margin-left:auto;}
body.editing .card,body.editing .mini{outline:1.5px dashed var(--gold-line);outline-offset:4px;}
.secbar{display:none;gap:6px;position:absolute;top:10px;right:10px;z-index:3;}
body.editing .secbar{display:flex;}
.secbar button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink);font-size:14px;line-height:1;display:flex;
  align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(30,49,69,.1);}
.secbar button.rm{color:#B4452F;}
.secbar button[disabled]{opacity:.3;cursor:default;}
.addgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
.addbtn{border:1px dashed var(--line-2);background:#fff;border-radius:14px;padding:14px 16px;text-align:left;}
.addbtn:hover{border-color:var(--gold);background:var(--gold-wash);}
.addbtn b{display:block;font-size:14px;color:var(--ink);}
.addbtn span{font-size:12.5px;color:var(--muted);line-height:1.5;}

/* ---------- tour ---------- */
.tour-veil{position:fixed;inset:0;z-index:900;background:rgba(18,34,51,.55);
  backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:24px;}
.tour{background:#fff;border-radius:22px;max-width:460px;width:100%;
  box-shadow:0 30px 80px rgba(30,49,69,.3);padding:clamp(24px,3vw,32px);
  position:relative;z-index:920;}
body.tour-open{overflow:hidden;}
.tour .k{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-deep);}
.tour h3{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3vw,30px);color:var(--ink);
  letter-spacing:-.025em;line-height:1.14;margin:12px 0 10px;}
.tour h3 em{font-style:italic;color:var(--gold-deep);font-weight:400;}
.tour p{font-size:15px;color:var(--body-c);line-height:1.75;}
.tour .dots{display:flex;gap:6px;margin:22px 0 18px;}
.tour .dots i{height:4px;flex:1;border-radius:99px;background:var(--line);}
.tour .dots i.on{background:var(--gold);}
.tour .row{display:flex;gap:9px;}
.tour .row .pill{flex:1;padding:13px;font-size:14px;}
.tour .skip{display:block;width:100%;text-align:center;margin-top:12px;font-size:12.5px;
  color:var(--faint);text-decoration:underline;text-underline-offset:3px;}
.tour .skip:hover{color:var(--muted);}
.spot{position:relative;z-index:901;box-shadow:0 0 0 4px var(--gold),0 24px 60px rgba(30,49,69,.3);
  border-radius:20px;}

.load{text-align:center;padding:60px 20px;color:var(--muted);font-size:14.5px;}
.foot-note{font-size:12px;color:var(--faint);text-align:center;margin-top:24px;}
</style>
</head>
<body class="nav-dark">
<div id="nav"></div>

<main class="dash" id="dash">
  <div class="load">Loading your practice…</div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
'use strict';

/* ============================================================
   Sections an advisor can arrange on their dashboard
   ============================================================ */
const SECTIONS = {
  profile_edit: { name:'Your public profile', col:'main',
                  blurb:'Headshot, bio, specialties and rate — and the publish button.' },
  appts:        { name:'Appointments',        col:'main',
                  blurb:'Everything booked with you, upcoming and past.' },
  week:         { name:'Your week',           col:'main',
                  blurb:'The hours you work and the switches that control them.' },
  earn:         { name:'Earnings',            col:'rail',
                  blurb:'What you have billed through Greylock so far.' },
  strength:     { name:'Profile strength',    col:'rail',
                  blurb:'What is filled in on your public page and what is missing.' },
  todo:         { name:'Needs you',           col:'rail',
                  blurb:'Clients to prepare for and notes still to write.' },
};
const DEFAULT_LAYOUT = ['profile_edit','appts','week','earn','strength','todo'];

const TOUR = [
  { k:'Welcome',     h:'Your practice, <em>in one place</em>.',
    p:'This is where your Greylock work lives. Four quick things and it\u2019s yours.' },
  { k:'Step 1 of 3', h:'Write your <em>own profile</em>.',
    p:'Your headshot, your words, your rate. Nobody can see it until you press publish — and you can change it any time after.', spot:'sec-profile_edit' },
  { k:'Step 2 of 3', h:'Bookings arrive <em>here</em>.',
    p:'The moment a client confirms, they appear in Appointments. Afterwards, hit <b>Write notes</b> — what you write lands on their dashboard and stays there for good.', spot:'sec-appts' },
  { k:'Step 3 of 3', h:'Arrange it <em>how you like</em>.',
    p:'Use <b>Edit layout</b> to move sections around or hide the ones you don\u2019t need. Nothing is permanent.', spot:'editAnchor' },
];

/* ---------- profile editor options ---------- */
const PERSONALITY_OPTS = ['Patient teacher','Friendly conversationalist',
  'Efficient problem solver','Highly technical expert','Calm and reassuring'];
const PLATFORM_OPTS = ['Windows','Mac','iPhone / iPad','Android'];
const SPEC_OPTS = ['Wi-Fi & Internet','Data Protection','Computers & Laptops',
  'Phones & Tablets','Setup, Repairs & Troubleshooting','Email & Accounts'];
const FUTURE_OPTS = ['Home networking','Smart home security','Account security','AI tools',
  'New computers','Phone setup','Family technology support','Data backup',
  'Cloud storage','Privacy improvements','Technology education','Digital organization'];

/* ---------- state ---------- */
let ME = null;        // session profile
let ADV = null;       // advisors row
let P = null;         // working copy of the profile being edited
let LAYOUT = [];
let ROWS = [];        // bookings
let NOTES = {};       // booking_id -> visit_note
let EDITING = false, DIRTY = false, TAB = 'upcoming', TOUR_STEP = 0;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(s){
  return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function arr(v){ return Array.isArray(v) ? v : []; }
function ymdLocal(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayParts(iso){
  if(!iso) return ['—','',''];
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return [DOW[dt.getDay()], String(d), MONTHS[m-1].slice(0,3)];
}
function longDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return DOW[dt.getDay()]+' '+d+' '+MONTHS[m-1];
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  const r = await GT_AUTH.requireAdvisor();
  if(!r) return;                       // already redirecting to the portal

  if(r.blocked){
    drawBlocked(r.session);
    return;
  }

  ME = r.session;
  ADV = r.advisor;

  P = {
    name:        ADV.name || ME.name || '',
    title:       ADV.title || 'Privacy Advisor',
    years:       ADV.years ?? '',
    rate:        ADV.rate ?? '',
    bio:         ADV.bio || '',
    photo_url:   ADV.photo_url || '',
    personality: ADV.personality || '',
    specs:       arr(ADV.specs),
    futures:     arr(ADV.futures),
    platforms:   arr(ADV.platforms),
    onsite:      ADV.onsite !== false,
    remote:      ADV.remote !== false,
  };

  await loadData();

  const saved = (ME.layout && Array.isArray(ME.layout.sections)) ? ME.layout.sections : null;
  LAYOUT = (saved && saved.length) ? saved.filter(k => SECTIONS[k]) : DEFAULT_LAYOUT.slice();

  render();

  if(!(ME.layout && ME.layout.tour === 'done')) drawTour();

  window.addEventListener('beforeunload', e => {
    if(DIRTY){ e.preventDefault(); e.returnValue = ''; }
  });
})();

async function drawBlocked(session){
  /* Signed in, but no advisors row. Say why, based on their application. */
  let msg = `You're signed in as <b>${esc(session.email)}</b>, but there's no advisor
    profile attached to this account yet.`;

  try{
    const { data: app } = await GT_AUTH.SB
      .from('advisor_applications').select('status')
      .eq('user_id', session.id)
      .order('created_at', { ascending:false }).limit(1).maybeSingle();

    if(app && (app.status === 'new' || app.status === 'reviewing')){
      msg = `Your application is with us now. We read every one personally and
        reply within three business days — you'll get an email either way.
        Nothing more for you to do until then.`;
    }else if(app && app.status === 'declined'){
      msg = `We're not able to bring you on at the moment. If you'd like to talk
        it through, email <b>team@greylocktrust.com</b> — we're happy to explain
        and to look again later.`;
    }else if(!app){
      msg = `You're signed in as <b>${esc(session.email)}</b>, but you haven't
        applied to advise with us yet.`;
    }
  }catch(e){ /* fall back to the generic message */ }

  $('dash').innerHTML = `
    <div class="card" style="max-width:560px;margin:40px auto 0;text-align:center">
      <h2 style="font-family:var(--serif);font-weight:400;font-size:23px;color:var(--ink);
                 margin-bottom:12px">Nothing here yet</h2>
      <p style="font-size:14.5px;color:var(--muted);line-height:1.75">${msg}</p>
      <div style="display:flex;gap:9px;justify-content:center;margin-top:20px;flex-wrap:wrap">
        <a class="pill pill-soft" href="index.html">Back to the site</a>
        <a class="pill pill-gold" href="join.html">Apply to join</a>
      </div>
    </div>`;
}

async function loadData(){
  const { data, error } = await GT_AUTH.SB.from('bookings')
    .select('*').eq('advisor_id', ADV.id).order('day', { ascending:true });
  if(error) console.warn('[GT] bookings load failed:', error.message);
  ROWS = data || [];

  const { data: nt } = await GT_AUTH.SB.from('visit_notes')
    .select('*').eq('advisor_id', ADV.id);
  NOTES = {};
  (nt || []).forEach(n => { if(n.booking_id) NOTES[n.booking_id] = n; });
}

async function saveLayout(tour){
  const patch = { sections: LAYOUT, tour: tour || (ME.layout && ME.layout.tour) || 'done' };
  ME.layout = patch;
  const { error } = await GT_AUTH.SB.from('profiles')
    .update({ layout: patch }).eq('id', ME.id);
  if(error) console.warn('[GT] layout not saved:', error.message);
}

function split(){
  const today = ymdLocal(new Date());
  return {
    upcoming: ROWS.filter(b => b.day >= today && b.status !== 'cancelled'),
    past:     ROWS.filter(b => b.day < today || b.status === 'cancelled'),
  };
}

function render(){
  const { upcoming, past } = split();
  const first = (ADV.name || '').split(' ')[0] || 'there';

  const part  = hour<12 ? 'Good morning' : hour<18 ? 'Good afternoon' : 'Good evening';

  $('dash').innerHTML = `
    <div class="greet">
      <div class="who">
        ${ADV.photo_url ? `<img class="av" src="${esc(ADV.photo_url)}" alt="">`
                        : `<div class="fb">${GT_AUTH.initials(ADV.name || ME.email)}</div>`}
        <div>
          <h1>${part}, <em>${esc(first)}.</em></h1>
          <p class="sub">${esc(ADV.title||'Privacy Advisor')}${ADV.rate?' · $'+ADV.rate+'/hour':''} ·
            ${ADV.published ? 'Live and accepting bookings' : 'Not published yet'}</p>
        </div>
      </div>

        <button class="pill pill-soft" id="editBtn">Edit layout</button>

          : ''}

      <i>!</i>
      <div><b>Your profile isn't published yet</b>
        <p>Clients can't find or book you until you publish it. Fill in your
           profile below and the publish button switches on — it's entirely
           your call when that happens.</p></div>
    </div>`}
    <div class="strip" id="strip"></div>
    <div id="editbar"></div>
    <div class="cols"><div id="colMain"></div><aside id="colRail"></aside></div>
    <p class="foot-note">Payouts aren't automated yet — we settle up with you directly.</p>`;

  drawStrip(upcoming, past);
  drawColumns(upcoming, past);
  drawEditBar();

  $('editBtn').addEventListener('click', () => {
    EDITING = !EDITING;
    document.body.classList.toggle('editing', EDITING);
    $('editBtn').textContent = EDITING ? 'Done editing' : 'Edit layout';
    drawColumns(upcoming, past);
    drawEditBar();
    if(!EDITING) saveLayout();
  });
}

function drawStrip(upcoming, past){
  const weekEnd = ymdLocal(new Date(Date.now() + 7*864e5));
  const wk = upcoming.filter(b => b.day <= weekEnd);
  const unwritten = past.filter(b => b.status !== 'cancelled' && !NOTES[b.id]).length;
  $('strip').innerHTML = `
    <div class="stat"><div class="k">Next 7 days</div>
      <div class="v">${wk.filter(b=>b.kind!=='intro').length}</div>
      <div class="n">booked sessions</div></div>
    <div class="stat"><div class="k">Intro calls</div>
      <div class="v">${wk.filter(b=>b.kind==='intro').length}</div>
      <div class="n">free, 20 minutes each</div></div>
    <div class="stat gold"><div class="k">All upcoming</div>
      <div class="v">${upcoming.length}</div><div class="n">on your calendar</div></div>
    <div class="stat"><div class="k">Notes to write</div>
      <div class="v">${unwritten}</div><div class="n">visits without a write-up</div></div>`;
}

function secbar(key){
  const i = LAYOUT.indexOf(key);
  return `<div class="secbar">
    <button data-up="${key}" ${i<=0?'disabled':''} aria-label="Move up">↑</button>
    <button data-down="${key}" ${i>=LAYOUT.length-1?'disabled':''} aria-label="Move down">↓</button>
    <button class="rm" data-rm="${key}" aria-label="Remove">×</button>
  </div>`;
}

function drawColumns(upcoming, past){
  const main = $('colMain'), rail = $('colRail');
  main.innerHTML = ''; rail.innerHTML = '';

  LAYOUT.forEach(key => {
    const def = SECTIONS[key];
    if(!def) return;
    (def.col === 'rail' ? rail : main)
      .insertAdjacentHTML('beforeend', sectionHTML(key, upcoming, past));
  });

  if(!LAYOUT.length){
    main.innerHTML = `<div class="card"><div class="empty">
      <div class="ic">+</div><h4>Nothing on your dashboard</h4>
      <p>You've removed every section. Use <b>Edit layout</b> above to put some back.</p>
    </div></div>`;
  }

  wireControls();
  drawAppts();
  if(LAYOUT.includes('profile_edit')) drawEditor();
}

function sectionHTML(key, upcoming, past){
  const bar = secbar(key);

  /* ---------------- profile editor shell ---------------- */
  if(key === 'profile_edit'){
    return `<section class="card" id="sec-profile_edit">${bar}
      <div class="ch"><h2>Your public profile</h2>
        ${ADV.published
          ? `<a class="more" href="advisor.html?id=${ADV.id}#a=${ADV.id}">View it live</a>`
          : '<span class="more" style="color:var(--faint)">Not published</span>'}</div>
      <div id="editorHost"></div></section>`;
  }

  /* ---------------- appointments shell ---------------- */
  if(key === 'appts'){
    return `<section class="card" id="sec-appts">${bar}
      <div class="ch"><h2>Appointments</h2></div>
      <div class="tabs" id="tabs"></div>
      <div id="apptList"></div></section>`;
  }

  /* ---------------- your week ---------------- */
  if(key === 'week'){
    const WK = [['Mon','9–5'],['Tue','9–5'],['Wed','9–5'],
                ['Thu', ADV.evenings?'9–7':'9–5'],['Fri','9–3'],
                ['Sat', ADV.weekends?'10–2':'Off'],['Sun','Off']];
    const TOGS = [
      ['intro','Offer free 20-minute intro calls','Shown as a gold badge on your profile',ADV.intro],
      ['evenings','Available evenings','Adds later slots on weekdays',ADV.evenings],
      ['weekends','Available weekends','Opens Saturday bookings',ADV.weekends],
      ['checkins','Offer recurring check-ins','Clients can book you quarterly',ADV.checkins],
      ['business','Take small-business work','Appears in the business support filter',ADV.business],
    ];
    return `<section class="card" id="sec-week">${bar}
      <div class="ch"><h2>Your week</h2></div>
      <div class="avail">${WK.map(([d,h])=>`
        <div class="day ${h==='Off'?'off':'on'}"><div class="dw">${d}</div>
          <div class="hrs">${h}</div></div>`).join('')}</div>
      <div class="togs">${TOGS.map(([k,t,s,on])=>`
        <div class="tog"><div class="lab">${t}<small>${s}</small></div>
          <button class="sw ${on?'on':''}" data-k="${k}" aria-label="${t}"></button></div>`).join('')}</div>
    </section>`;
  }

  /* ---------------- earnings ---------------- */
  if(key === 'earn'){
    const billable = past.filter(b => b.kind !== 'intro' && b.status !== 'cancelled').length;
    const rate = Number(ADV.rate || 0);
    const gross = billable * rate, fee = gross*.15, net = gross - fee;
    return `<div class="mini pay" id="sec-earn">${bar}
      <h3>Earned so far</h3>
      <div class="amt">$${net.toFixed(0)}</div>
      <div class="sub">${billable} completed session${billable===1?'':'s'}</div>
      <div class="rows">
        <div class="r"><span>Billed to clients</span><b>$${gross.toFixed(0)}</b></div>
        <div class="r"><span>Platform fee (15%)</span><b>−$${fee.toFixed(0)}</b></div>
        <div class="r"><span>Your rate</span><b>$${rate}/hr</b></div>
      </div></div>`;
  }

  /* ---------------- profile strength ---------------- */
  if(key === 'strength'){
    const c = checks();
    const pct = Math.round(c.filter(x=>x[1]).length / c.length * 100);
    return `<div class="mini" id="sec-strength">${bar}
      <h3>Profile strength</h3>
      <div style="font-size:24px;font-weight:700;color:var(--ink)">${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <p style="font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.6">
        Fuller profiles get chosen more often — people book the person they can picture.</p>
      ${c.map(([t,ok])=>`<div class="chk ${ok?'ok':'no'}"><i>${ok?'✓':''}</i><span>${t}</span></div>`).join('')}
    </div>`;
  }

  /* ---------------- needs you ---------------- */
  if(key === 'todo'){
    const soon = upcoming.slice(0,3);
    const unwritten = past.filter(b => b.status !== 'cancelled' && !NOTES[b.id]).slice(0,3);
    const items = [
      ...unwritten.map(b => `Write up <b>${esc(b.name||'a visit')}</b> — ${esc(longDate(b.day))}`),
      ...soon.map(b => `Prepare for <b>${esc(b.name||'your client')}</b> — ${esc(longDate(b.day))}`),
    ];
    return `<div class="mini" id="sec-todo">${bar}
      <h3>Needs you</h3>
      ${items.length
        ? items.map(t => `<div class="task"><span class="dot"></span><span>${t}</span></div>`).join('')
        : `<div class="task"><span class="dot"></span><span>Nothing outstanding.</span></div>`}
    </div>`;
  }

  return '';
}

function drawPreview(){

function chipRow(hostId, opts, selected, onToggle){
  const host = $(hostId);
  if(!host) return;
  host.innerHTML = opts.map(o =>
    `<button type="button" class="chip-b ${selected.includes(o)?'on':''}" data-v="${esc(o)}">${esc(o)}</button>`
  ).join('');
  host.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    onToggle(b.dataset.v);
    touch();
    drawChips();
    drawPublish();
    refreshStrength();
  }));
}

function drawChips(){
  chipRow('persChips', PERSONALITY_OPTS, P.personality ? [P.personality] : [], v => {
    P.personality = (P.personality === v) ? '' : v;
  });
  chipRow('specChips', SPEC_OPTS, P.specs, v => {
    const i = P.specs.indexOf(v); i > -1 ? P.specs.splice(i,1) : P.specs.push(v);
  });
  chipRow('futChips', FUTURE_OPTS, P.futures, v => {
    const i = P.futures.indexOf(v); i > -1 ? P.futures.splice(i,1) : P.futures.push(v);
  });
  chipRow('platChips', PLATFORM_OPTS, P.platforms, v => {
    const i = P.platforms.indexOf(v); i > -1 ? P.platforms.splice(i,1) : P.platforms.push(v);
  });

  const modes = [];
  if(P.onsite) modes.push('In person');
  if(P.remote) modes.push('Virtually');
  chipRow('modeChips', ['In person','Virtually'], modes, v => {
    if(v === 'In person') P.onsite = !P.onsite; else P.remote = !P.remote;
  });
}

function drawPublish(){

function refreshStrength(){
  if(!LAYOUT.includes('strength')) return;
  const host = $('sec-strength');
  if(!host) return;
  const c = checks();
  const pct = Math.round(c.filter(x=>x[1]).length / c.length * 100);
  const bar = host.querySelector('.bar i');

function touch(){
  DIRTY = true;
  const m = $('saveMsg');
  if(m){ m.textContent = 'Unsaved changes'; m.style.color = 'var(--gold-deep)'; }

function bioCount(){
  const el = $('bioCount');
  if(!el) return;
  const n = ($('fBio') ? $('fBio').value : P.bio || '').trim().length;
  el.textContent = n + ' / 120';
  el.style.color = n >= 120 ? 'var(--gold-deep)' : 'var(--faint)';

function wireEditor(){
  const bind = (id, key) => {
    const el = $(id);
    if(!el) return;
    el.addEventListener('input', () => {
      P[key] = el.value;
      touch();
      drawPublish();
      refreshStrength();
      if(key === 'name') drawPreview();
      if(key === 'bio') bioCount();
    });
  };
  bind('fName','name'); bind('fTitle','title');
  bind('fYears','years'); bind('fRate','rate'); bind('fBio','bio');

  const save = $('saveBtn');
  if(save) save.addEventListener('click', saveProfile);

  const file = $('photoFile');
  if(file) file.addEventListener('change', uploadPhoto);
}

async function uploadPhoto(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const note = $('photoNote');
  note.className = 'note';

  if(f.size > 5 * 1024 * 1024){
    note.className = 'note err';
    note.textContent = 'That file is over 5 MB. Try a smaller one.';
    return;
  }

  note.textContent = 'Uploading…';

  const ext  = (f.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${ME.id}/headshot-${Date.now()}.${ext}`;

  const { error: upErr } = await GT_AUTH.SB.storage
    .from('headshots').upload(path, f, { upsert:true, contentType:f.type });

  if(upErr){
    console.error('[GT] headshot upload failed:', upErr);
    note.className = 'note err';
    note.textContent = 'That didn\u2019t upload. Try again, or email team@greylocktrust.com.';
    return;
  }

  const { data } = GT_AUTH.SB.storage.from('headshots').getPublicUrl(path);
  P.photo_url = data.publicUrl;

  const { error: saveErr } = await GT_AUTH.SB.from('advisors')
    .update({ photo_url: P.photo_url }).eq('id', ADV.id);

  if(saveErr){
    note.className = 'note err';
    note.textContent = 'Uploaded, but we couldn\u2019t attach it: ' + saveErr.message;
    return;
  }

  ADV.photo_url = P.photo_url;
  note.className = 'note ok';
  note.textContent = 'Headshot saved.';
  drawPreview(); drawPublish(); refreshStrength();
}

async function saveProfile(){
  const btn = $('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const patch = {
    name:        (P.name||'').trim(),
    title:       (P.title||'Privacy Advisor').trim(),
    years:       P.years === '' ? null : parseInt(P.years,10),
    rate:        P.rate  === '' ? null : parseInt(P.rate,10),
    bio:         (P.bio||'').trim(),
    personality: P.personality || null,
    specs:       P.specs,
    futures:     P.futures,
    platforms:   P.platforms,
    onsite:      !!P.onsite,
    remote:      !!P.remote,
  };

  const { error } = await GT_AUTH.SB.from('advisors').update(patch).eq('id', ADV.id);

  btn.disabled = false; btn.textContent = 'Save changes';
  const m = $('saveMsg');

  if(error){
    console.error('[GT] profile not saved:', error);
    m.textContent = 'Couldn\u2019t save: ' + error.message;
    m.style.color = '#B4452F';
    return false;
  }

  Object.assign(ADV, patch);
  DIRTY = false;
  m.textContent = 'All changes saved';
  m.style.color = 'var(--muted)';
  drawPublish(); refreshStrength();
  return true;
}

async function setPublished(on){
  /* Save first — the database refuses to publish an incomplete profile, and
     it can only judge what it already has. */
  if(on){
    const ok = await saveProfile();
    if(!ok) return;
  }

  const { error } = await GT_AUTH.SB.from('advisors')
    .update({ published: on }).eq('id', ADV.id);

  if(error){
    console.error('[GT] publish failed:', error);
    const n = $('pubNote');
    if(n){
      n.className = 'note err';
      n.style.color = '#FFD9CF';
      n.textContent = error.message.replace(/^.*?:\s*/, '');
    }
    return;
  }

  ADV.published = on;
  render();
  if(on) window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============================================================
   APPOINTMENTS
   ============================================================ */
function drawAppts(){
  const tabs = $('tabs'), list = $('apptList');
  if(!tabs || !list) return;
  const { upcoming, past } = split();

  tabs.innerHTML = `
    <button class="tab ${TAB==='upcoming'?'on':''}" data-t="upcoming">Upcoming<span class="badge">${upcoming.length}</span></button>
    <button class="tab ${TAB==='past'?'on':''}" data-t="past">Past</button>`;
  tabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    TAB = b.dataset.t; drawAppts();
  }));

  const rows = TAB === 'upcoming' ? upcoming : past;

  if(!rows.length){
    list.innerHTML = `<div class="empty">
      <div class="ic">◷</div>
      <h4>${TAB==='upcoming'?'Nothing booked yet':'No past visits yet'}</h4>
      <p>${TAB==='upcoming'
        ? (ADV.published
            ? 'New bookings land here the moment a client confirms. Nothing for you to do until then.'
            : 'Clients can\u2019t book you until you publish your profile.')
        : 'Once you\u2019ve seen a client, the visit moves here so you can write it up.'}</p>
    </div>`;
    return;
  }

  list.innerHTML = rows.map(b => {
    const w = dayParts(b.day);
    const up = TAB === 'upcoming';
    const note = NOTES[b.id];
    return `<div class="appt">
      <div class="when"><div class="d">${w[2]}</div><div class="n">${w[1]}</div>
        <div class="t">${esc(b.slot||'')}</div></div>
      <div class="who2">
        <div class="nm">${esc(b.name || 'Client')}</div>
        <div class="meta">${esc(b.notes || 'No notes from the client')}</div>
        <div class="tags">
          <span class="tg ${b.kind==='intro'?'gold':''}">${b.kind==='intro'?'Intro call':'Session'}</span>
          <span class="tg">${esc(b.mode||'')}</span>
          ${b.address?`<span class="tg">${esc(b.address)}</span>`:''}
          ${b.status==='cancelled'?'<span class="tg ink">Cancelled</span>':''}
          ${(!up && b.status!=='cancelled' && !note)?'<span class="tg gold">Notes to write</span>':''}
        </div>
      </div>
      <div class="go">
        <a class="pill pill-soft" href="mailto:${encodeURIComponent(b.email||'')}">Email</a>
        ${up
          ? `<button class="pill pill-ink" data-cancel="${b.id}">Cancel</button>`
          : (b.status !== 'cancelled'
              ? `<button class="pill pill-ink" data-note="${b.id}">${note?'Edit notes':'Write notes'}</button>`
              : '')}
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm('Cancel this booking? The client isn\u2019t emailed automatically — let them know directly.')) return;
    b.disabled = true;
    const { error } = await GT_AUTH.SB.from('bookings')
      .update({ status:'cancelled' }).eq('id', b.dataset.cancel);
    if(error){ alert('Could not cancel: ' + error.message); b.disabled = false; return; }
    await loadData(); render();
  }));

  list.querySelectorAll('[data-note]').forEach(b =>
    b.addEventListener('click', () => openNote(b.dataset.note)));
}

/* ---------- note writer ---------- */
function openNote(bookingId){
  const b = ROWS.find(x => String(x.id) === String(bookingId));
  if(!b) return;
  const existing = NOTES[bookingId];

  const veil = document.createElement('div');
  veil.className = 'sheet';
  veil.id = 'noteSheet';
  veil.innerHTML = `
    <div class="sheet-in">
      <h3>${existing ? 'Edit your notes' : 'Write up this visit'}</h3>
      <p class="sub">${esc(b.name||'Client')} · ${esc(longDate(b.day))}. This goes
        straight to their dashboard and stays there.</p>
      <div class="fld"><label>What was this visit about?
        <input id="nTitle" type="text" value="${esc(existing?existing.title:'')}"
          placeholder="Wi-Fi dead zones upstairs"></label></div>
      <div class="fld"><label>What you did, and what you agreed
        <textarea id="nBody" rows="9" placeholder="Write it the way you'd explain it to them — plain words, no jargon. Anything they need to remember, and anything you agreed to do next.">${esc(existing?existing.body:'')}</textarea></label></div>
      <p style="font-size:12px;color:var(--faint);line-height:1.6">
        They can read this any time. Don't put passwords or recovery codes here.</p>
      <div class="row">
        <button class="pill pill-soft" id="nCancel">Cancel</button>
        <button class="pill pill-gold" id="nSave">Save notes</button>
      </div>
    </div>`;
  document.body.appendChild(veil);

  $('nCancel').addEventListener('click', () => veil.remove());

  $('nSave').addEventListener('click', async () => {
    const title = $('nTitle').value.trim();
    const body  = $('nBody').value.trim();
    if(body.length < 10){ alert('Add a little more detail before saving.'); return; }

    const btn = $('nSave');
    btn.disabled = true; btn.textContent = 'Saving…';

    const row = {
      booking_id: b.id,
      advisor_id: ADV.id,
      client_id:  b.client_id,
      title, body,
      updated_at: new Date().toISOString(),
    };

    const { error } = existing
      ? await GT_AUTH.SB.from('visit_notes').update(row).eq('id', existing.id)
      : await GT_AUTH.SB.from('visit_notes').insert(row);

    if(error){
      alert('We couldn\u2019t save that: ' + error.message);
      btn.disabled = false; btn.textContent = 'Save notes';
      return;
    }
    veil.remove();
    await loadData(); render();
  });
}

/* ============================================================
   LAYOUT CONTROLS
   ============================================================ */
function wireControls(){
  document.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => {
    LAYOUT = LAYOUT.filter(k => k !== b.dataset.rm); saveLayout(); render(); reopenEdit();
  }));
  document.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
    const i = LAYOUT.indexOf(b.dataset.up);
    if(i > 0){ [LAYOUT[i-1],LAYOUT[i]] = [LAYOUT[i],LAYOUT[i-1]]; saveLayout(); render(); reopenEdit(); }
  }));
  document.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => {
    const i = LAYOUT.indexOf(b.dataset.down);
    if(i > -1 && i < LAYOUT.length-1){
      [LAYOUT[i+1],LAYOUT[i]] = [LAYOUT[i],LAYOUT[i+1]]; saveLayout(); render(); reopenEdit();
    }
  }));
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', async () => {
    const on = !b.classList.contains('on');
    b.classList.toggle('on', on);
    const { error } = await GT_AUTH.SB.from('advisors')
      .update({ [b.dataset.k]: on }).eq('id', ADV.id);
    if(error){ b.classList.toggle('on', !on); alert('Could not save: ' + error.message); return; }
    ADV[b.dataset.k] = on;
  }));
}

function reopenEdit(){
  if(!EDITING) return;
  document.body.classList.add('editing');
  const b = $('editBtn');
  if(b) b.textContent = 'Done editing';
}

function drawEditBar(){
  const bar = $('editbar');
  if(!EDITING){ bar.innerHTML = ''; return; }
  const missing = Object.keys(SECTIONS).filter(k => !LAYOUT.includes(k));
  bar.innerHTML = `
    <div class="editbar">
      <div><b>Editing your layout</b>
        <span style="display:block;margin-top:3px">Arrows move a section, × removes it.
          Everything saves as you go.</span></div>
      <div class="sp"><button class="pill pill-soft" id="resetLayout">Reset to default</button></div>
    </div>
    ${missing.length ? `<section class="card">
      <div class="ch"><h2>Add a section</h2></div>
      <div class="addgrid">${missing.map(k => `<button class="addbtn" data-add="${k}">
        <b>${SECTIONS[k].name}</b><span>${SECTIONS[k].blurb}</span></button>`).join('')}</div>
    </section>` : ''}`;

  const reset = $('resetLayout');
  if(reset) reset.addEventListener('click', () => {
    LAYOUT = DEFAULT_LAYOUT.slice(); saveLayout(); render(); reopenEdit();
  });
  document.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    LAYOUT.push(b.dataset.add); saveLayout(); render(); reopenEdit();
  }));
}

/* ============================================================
   TOUR
   ============================================================ */
function drawTour(){
  document.querySelectorAll('.spot').forEach(el => el.classList.remove('spot'));
  const s = TOUR[TOUR_STEP];
  if(!s){ endTour(); return; }

  if(s.spot){
    const el = $(s.spot);
    if(el){ el.classList.add('spot'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
  }

  let veil = $('tourVeil');
  if(!veil){
    veil = document.createElement('div');
    veil.className = 'tour-veil'; veil.id = 'tourVeil';
    document.body.appendChild(veil);
  }
  document.body.classList.add('tour-open');

  veil.innerHTML = `
    <div class="tour" role="dialog" aria-modal="true" aria-label="Getting started">
      <div class="k">${esc(s.k)}</div>
      <h3>${s.h}</h3>
      <p>${s.p}</p>
      <div class="dots">${TOUR.map((_,i)=>`<i class="${i<=TOUR_STEP?'on':''}"></i>`).join('')}</div>
      <div class="row">
        ${TOUR_STEP>0?'<button class="pill pill-soft" id="tourBack">Back</button>':''}
        <button class="pill pill-gold" id="tourNext">
          ${TOUR_STEP === TOUR.length-1 ? 'Finish' : 'Next'}</button>
      </div>
      <button class="skip" id="tourSkip">Skip — I'll find my way around</button>
    </div>`;

  $('tourNext').addEventListener('click', () => { TOUR_STEP++; drawTour(); });
  const back = $('tourBack');
  if(back) back.addEventListener('click', () => { TOUR_STEP--; drawTour(); });
  $('tourSkip').addEventListener('click', endTour);
}

function endTour(){
  document.querySelectorAll('.spot').forEach(el => el.classList.remove('spot'));
  const veil = $('tourVeil');
  if(veil) veil.remove();
  document.body.classList.remove('tour-open');
  saveLayout('done');
}
</script>
